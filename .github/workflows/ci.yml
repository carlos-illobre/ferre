name: CI

# master = ambiente de pruebas; produccion = ambiente de producción (ADR-012).
# Cada push a una de las dos ramas: pruebas, imágenes, cliente web en Pages y un aviso a
# la máquina de Oracle, que despliega sola el ambiente que corresponde (ADR-013).
on:
  push:
    branches: [master, produccion]
  pull_request:
  # A mano, para republicar el cliente web cuando cambia una variable del repositorio.
  workflow_dispatch:

env:
  REGISTRO: ghcr.io/${{ github.repository }}

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: VITE_API_URL=http://localhost pnpm build
      - run: pnpm test

  listas-de-proveedores:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: microservices/listas-de-proveedores } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -q

  configuracion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Paridad de .env y compose resuelto sin variables sin definir
        run: |
          cp .env.example .env
          tests/itest.sh --rapido
          docker compose config --quiet

  e2e:
    needs: [typescript, listas-de-proveedores, configuracion]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - run: tests/itest.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: Preparar stack y cliente web
        run: tests/e2e.sh --preparar
      # Un paso por escenario, para ver el avance en el job. `always()` para que un fallo
      # no oculte cómo les fue a los demás.
      - name: "00 · La app abre y el servidor responde"
        run: PLAYWRIGHT_JSON=/tmp/e2e-00.json tests/e2e.sh --escenario 00-arranque.spec.ts
      - name: "01 · Entrar"
        if: always()
        run: PLAYWRIGHT_JSON=/tmp/e2e-01.json tests/e2e.sh --escenario 01-login.spec.ts
      - name: "02 · Cargar una lista de precios"
        if: always()
        run: PLAYWRIGHT_JSON=/tmp/e2e-02.json tests/e2e.sh --escenario 02-listas.spec.ts
      - name: "03 · Buscar productos y elegir margen"
        if: always()
        run: PLAYWRIGHT_JSON=/tmp/e2e-03.json tests/e2e.sh --escenario 03-productos.spec.ts
      - name: "04 · Vender"
        if: always()
        run: PLAYWRIGHT_JSON=/tmp/e2e-04.json tests/e2e.sh --escenario 04-vender.spec.ts
      - name: "05 · Ingresar mercadería"
        if: always()
        run: PLAYWRIGHT_JSON=/tmp/e2e-05.json tests/e2e.sh --escenario 05-compras.spec.ts
      - name: "06 · Stock"
        if: always()
        run: PLAYWRIGHT_JSON=/tmp/e2e-06.json tests/e2e.sh --escenario 06-stock.spec.ts
      - name: "07 · Contar un sector"
        if: always()
        run: PLAYWRIGHT_JSON=/tmp/e2e-07.json tests/e2e.sh --escenario 07-contar.spec.ts
      - name: "08 · Sin conexión"
        if: always()
        run: PLAYWRIGHT_JSON=/tmp/e2e-08.json tests/e2e.sh --escenario 08-sin-conexion.spec.ts
      - name: "10 · Escanear con el celular"
        if: always()
        run: PLAYWRIGHT_JSON=/tmp/e2e-10.json tests/e2e.sh --escenario 10-escaner.spec.ts
      - name: "11 · Duplicados entre proveedores"
        if: always()
        run: PLAYWRIGHT_JSON=/tmp/e2e-11.json tests/e2e.sh --escenario 11-duplicados.spec.ts
      - name: Resumen
        if: always()
        run: |
          {
            echo "## Escenarios E2E"
            echo "| Escenario | Resultado | Tiempo |"
            echo "|---|---|---|"
            for f in /tmp/e2e-*.json; do
              [ -f "$f" ] || continue
              jq -r '[.. | objects | select(has("specs")) | .specs[]] | .[] | (.tests[0].results[-1] // {}) as $r | "| \(.title) | \(if $r.status == "passed" then "✅" elif $r.status == "skipped" then "⏭️" elif $r.status == null then "⏭️ no corrió" else "❌ " + $r.status end) | \((($r.duration // 0) / 1000) | floor)s |"' "$f" 2>/dev/null || true
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        run: docker compose logs --no-color | tail -200

  imagenes:
    # La máquina de Oracle es Ampere (arm64): se construye en un runner ARM nativo, que
    # es varias veces más rápido que emular arm64 sobre x86 (ADR-007, ADR-012).
    if: github.event_name == 'push'
    needs: [e2e]
    runs-on: ubuntu-24.04-arm
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      # El compose exige todas las variables aunque solo se construya; la plantilla
      # alcanza porque ninguna entra en la imagen. IMAGEN_TAG del entorno pisa a la del .env.
      - run: cp .env.example .env
      - run: echo "IMAGEN_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - run: docker compose build gestion-del-local listas-de-proveedores
      - run: docker compose push gestion-del-local listas-de-proveedores

  avisar:
    # GitHub no entra a la máquina (ADR-013): publica un aviso en ntfy y la máquina, que
    # escucha ese canal, verifica contra GitHub y GHCR y despliega sola. El aviso no lleva
    # información; el nombre del canal es una variable del repositorio (NTFY_AVISOS).
    if: github.event_name == 'push'
    needs: [imagenes]
    runs-on: ubuntu-latest
    steps:
      - name: Avisar a la máquina
        env:
          NTFY_URL: ${{ vars.NTFY_URL || 'https://ntfy.sh' }}
          NTFY_AVISOS: ${{ vars.NTFY_AVISOS }}
        run: |
          if [ -z "$NTFY_AVISOS" ]; then
            echo "::warning::Sin la variable NTFY_AVISOS no se avisa a la máquina (ver deployment/oracle-single/ORACLE.md, paso 7)"
            exit 0
          fi
          curl -sf -o /dev/null -H "Title: ferre ${GITHUB_REF_NAME}" -d "${GITHUB_SHA::7} publicado" "$NTFY_URL/$NTFY_AVISOS"
          echo "aviso publicado en $NTFY_AVISOS para ${GITHUB_REF_NAME} ${GITHUB_SHA::7}"

  cliente-web:
    # Un solo sitio de Pages con dos carpetas: la raíz es la rama produccion y /pruebas/
    # es master (ADR-012). Cualquier push a una de las dos ramas regenera las dos.
    if: github.event_name == 'push'
    needs: [e2e]
    runs-on: ubuntu-latest
    # Un push a cada rama dispara este job dos veces casi a la vez; Pages acepta una
    # publicación por vez, así que se encolan en vez de pisarse.
    concurrency: { group: github-pages, cancel-in-progress: false }
    permissions: { contents: read, pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: produccion, path: produccion }
      - uses: actions/checkout@v4
        with: { ref: master, path: pruebas }
      - uses: pnpm/action-setup@v4
        with: { package_json_file: produccion/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Construir producción (raíz del sitio)
        working-directory: produccion
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter gestion-del-local-web... build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_BASE: /${{ github.event.repository.name }}/
      - name: Construir pruebas (/pruebas/)
        working-directory: pruebas
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter gestion-del-local-web... build
        env:
          VITE_API_URL: ${{ vars.API_URL_PRUEBAS }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_BASE: /${{ github.event.repository.name }}/pruebas/
      - name: Armar el sitio
        run: |
          mkdir -p sitio
          cp -r produccion/clientes/gestion-del-local-web/dist/. sitio/
          mkdir -p sitio/pruebas
          cp -r pruebas/clientes/gestion-del-local-web/dist/. sitio/pruebas/
      - uses: actions/upload-pages-artifact@v3
        with: { path: sitio }
      - id: deploy
        uses: actions/deploy-pages@v4
