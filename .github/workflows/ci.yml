name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  REGISTRO: ghcr.io/${{ github.repository }}

jobs:
  typescript:
    # gestion-del-local, el cliente web y calculo-de-precios comparten el workspace.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: VITE_API_URL=http://localhost pnpm build
      - run: pnpm test

  listas-de-proveedores:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: microservices/listas-de-proveedores } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest -q

  configuracion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Paridad de .env y compose resuelto sin variables sin definir
        run: |
          cp .env.example .env
          tests/itest.sh --rapido
          docker compose --profile local config --quiet

  e2e:
    needs: [typescript, listas-de-proveedores, configuracion]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: cp .env.example .env
      - run: docker compose --profile local up -d --build --wait
      - run: tests/itest.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: tests/e2e.sh
      - if: failure()
        run: docker compose --profile local logs --no-color | tail -200

  imagenes:
    # Solo en master: publica las imágenes etiquetadas por SHA corto, que es lo que
    # despliega deployment/oracle-single (ADR-007).
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [e2e]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      # El compose exige todas las variables aunque solo se construya; la plantilla
      # alcanza porque ninguna entra en la imagen. IMAGEN_TAG del entorno pisa a la del .env.
      - run: cp .env.example .env
      - run: echo "IMAGEN_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - run: docker compose build gestion-del-local listas-de-proveedores
      - run: docker compose push gestion-del-local listas-de-proveedores

  cliente-web:
    # Solo en master: publica el cliente web en GitHub Pages (ADR-010). API_URL es una
    # variable del repositorio (Settings → Secrets and variables → Actions → Variables).
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [e2e]
    runs-on: ubuntu-latest
    permissions: { contents: read, pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter gestion-del-local-web... build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with: { path: clientes/gestion-del-local-web/dist }
      - id: deploy
        uses: actions/deploy-pages@v4
