name: Monitor

# El monitor externo (RNF-12, specs/001-base-del-sistema historia 6; T091): una vez por día mira
# los dos ambientes desde afuera de la máquina de Oracle. Si el servidor no responde, o responde
# que su base no responde, la tarea falla y GitHub le manda un correo al dueño del repositorio.
# También corre a mano («Run workflow»). La base vive en la máquina y no se alcanza desde
# internet (ADR-026): lo dice la salud del servidor (specs/022, E05).
on:
  schedule:
    - cron: "47 11 * * *" # 08:47 en Buenos Aires
  workflow_dispatch:

permissions: {}

jobs:
  ambiente:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: producción
            api: https://ferre-api.duckdns.org
          - nombre: pruebas
            api: https://ferre-api-pruebas.duckdns.org
    name: ${{ matrix.nombre }}
    steps:
      - name: El servidor responde
        env:
          AMBIENTE: ${{ matrix.nombre }}
          API: ${{ matrix.api }}
        run: |
          if ! respuesta=$(curl -fsS --max-time 30 --retry 2 --retry-delay 20 "$API/health"); then
            echo "::error::El servidor de $AMBIENTE no responde ($API/health)."; exit 1
          fi
          echo "$respuesta" | grep -q '"ok":true' || { echo "::error::El servidor de $AMBIENTE contesta, pero no dice que anda (o su base no responde): $respuesta"; exit 1; }
          echo "El servidor de $AMBIENTE anda: $respuesta"
