# Único compose del proyecto. Lo que cambia entre ambientes sale del .env; lo que no
# cambia va literal acá. Sin valores por omisión: una variable ausente corta el arranque.
# Ver docs/adr/ADR-009-compose-unico-y-env.md.

# Dos ambientes en la misma máquina (ADR-012/013): cada uno es un proyecto de compose
# aparte (COMPOSE_PROJECT_NAME en su .env) con sus propios volúmenes y red. La API se
# publica solo en la interfaz local de la máquina (127.0.0.1:PUERTO_API); el reverse
# proxy de la máquina, que no es parte de este repo, la alcanza ahí. Perfiles, desde el .env:
#   gateway → Caddy local, solo para desarrollo (en Oracle lo pone la máquina)
# La base corre en todos los ambientes (ADR-026): una instancia por proyecto de compose, con
# una base y un usuario por servicio. Cada clave está una vez en el .env; acá se arma la cadena.

# Los logs de cada contenedor no pasan de 10 MB: dos archivos de 5 MB que rotan. Los dos
# ambientes comparten el disco de la máquina (decisión 161).
x-logs: &logs
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  reverse-proxy:
    image: caddy:2-alpine
    profiles: ["gateway"]
    restart: unless-stopped
    logging: *logs
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITIO: ${SITIO:?falta SITIO en el .env}
    volumes:
      - ./deployment/reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados y estado de ACME. Sin este volumen, cada reinicio vuelve a emitir
      # y agota el cupo de Let's Encrypt.
      - caddy-data:/data
    depends_on:
      gestion-del-local:
        condition: service_healthy

  gestion-del-local:
    image: ${REGISTRO:?falta REGISTRO en el .env}/gestion-del-local:${IMAGEN_TAG:?falta IMAGEN_TAG en el .env}
    build:
      # Contexto en la raíz por el workspace compartido (ADR-010).
      context: .
      dockerfile: microservices/api/Dockerfile
    restart: unless-stopped
    logging: *logs
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mostrador:${CLAVE_BASE_MOSTRADOR:?falta CLAVE_BASE_MOSTRADOR en el .env}@db:5432/mostrador
      TOKEN_SERVICIO: ${TOKEN_SERVICIO:?falta TOKEN_SERVICIO en el .env}
      ORIGEN_WEB: ${ORIGEN_WEB:?falta ORIGEN_WEB en el .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?falta GOOGLE_CLIENT_ID en el .env}
      # No cambia entre ambientes: el otro servicio siempre vive en la misma red del compose.
      LISTAS_DE_PROVEEDORES_URL: http://listas-de-proveedores:8000
      # Procesos (ADR-019): el servidor le pasa los pedidos de /procesos por la red interna.
      PROCESOS_URL: http://procesos:8090
      CARPETA_LISTAS: /app/datos/listas
      # Solo informativa: /health la devuelve para saber qué corre. No cambia el comportamiento.
      VERSION: ${IMAGEN_TAG:?falta IMAGEN_TAG en el .env}
      PORT: "8080"
    ports:
      # Solo en la interfaz local: desde internet no se llega sin pasar por el reverse proxy.
      - "127.0.0.1:${PUERTO_API:?falta PUERTO_API en el .env}:8080"
    volumes:
      # Archivos originales de las listas cargadas, para reprocesar (issue #12).
      - listas-data:/app/datos/listas
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 9
      start_period: 60s

  listas-de-proveedores:
    image: ${REGISTRO:?falta REGISTRO en el .env}/listas-de-proveedores:${IMAGEN_TAG:?falta IMAGEN_TAG en el .env}
    build: ./microservices/listas
    restart: unless-stopped
    logging: *logs
    environment:
      TOKEN_SERVICIO: ${TOKEN_SERVICIO:?falta TOKEN_SERVICIO en el .env}
      PORT: "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # Procesos (ADR-019): un módulo aparte que se lleva a otros proyectos. Tiene su propia base en la
  # misma instancia (ADR-026) y solo lo alcanza gestion-del-local por la red interna: no publica puertos.
  procesos:
    image: ${REGISTRO:?falta REGISTRO en el .env}/procesos:${IMAGEN_TAG:?falta IMAGEN_TAG en el .env}
    build:
      context: .
      dockerfile: microservices/procesos/servidor/Dockerfile
    restart: unless-stopped
    logging: *logs
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://procesos:${CLAVE_BASE_PROCESOS:?falta CLAVE_BASE_PROCESOS en el .env}@db:5432/procesos
      TOKEN_SERVICIO: ${TOKEN_SERVICIO:?falta TOKEN_SERVICIO en el .env}
      PORT: "8090"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 9
      start_period: 30s

  # La base de datos (ADR-026). Publicada solo en la interfaz local: desde internet no se llega.
  db:
    image: ${REGISTRO:?falta REGISTRO en el .env}/base-de-datos:${IMAGEN_TAG:?falta IMAGEN_TAG en el .env}
    build: ./microservices/base-de-datos
    restart: unless-stopped
    logging: *logs
    environment:
      POSTGRES_PASSWORD: ${CLAVE_BASE_ADMIN:?falta CLAVE_BASE_ADMIN en el .env}
      CLAVE_BASE_MOSTRADOR: ${CLAVE_BASE_MOSTRADOR:?falta CLAVE_BASE_MOSTRADOR en el .env}
      CLAVE_BASE_PROCESOS: ${CLAVE_BASE_PROCESOS:?falta CLAVE_BASE_PROCESOS en el .env}
    ports:
      - "127.0.0.1:${PUERTO_BASE:?falta PUERTO_BASE en el .env}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caddy-data:
  db-data:
  listas-data:

