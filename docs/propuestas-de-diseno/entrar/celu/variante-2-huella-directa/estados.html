<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · La huella es la puerta · estados (celular)</title>
<link rel="stylesheet" href="../../../_comun/comun.css">
<link rel="stylesheet" href="../../_recursos/entrar.css">
<link rel="stylesheet" href="estilo.css">
<script src="../../../_comun/iconos.js"></script>
<script src="../../_recursos/iconos-extra.js"></script>
<script src="../../_recursos/entrar.js"></script>
</head>
<body style="margin:0">
<div class="fila-celus">

<figure><figcaption>Celular nuevo: Google, un botón</figcaption>
<div class="celu">
  <div class="barra-estado"><span>8:46</span><span class="se"><i class="i i-s" data-i="wifi"></i></span></div>
  <div class="puerta nuevo">
    <img class="iso" src="../../_recursos/logotipo-claro.png" alt="Ferrebress">
    <div class="ilus">
      <span class="tel"><i class="i i-xl" data-i="fingerprint"></i></span>
      <span class="lazo"></span>
      <span class="comp"><img src="../../_recursos/isotipo-claro.png" alt=""></span>
    </div>
    <div class="titulo-g">Entrá con tu cuenta de Google</div>
    <p>La que te autorizó el Administrador. Sin contraseñas.</p>
    <button class="g-btn"><span class="g"></span>Continuar con Google</button>
    <button class="btn btn-fantasma link"><i class="i" data-i="qr-code"></i>Entrar en la compu</button>
  </div>
  <span class="home-ind"></span>
</div></figure>

<figure><figcaption>Primera vez: la oferta a pantalla completa</figcaption>
<div class="celu">
  <div class="barra-estado"><span>8:47</span><span class="se"><i class="i i-s" data-i="wifi"></i></span></div>
  <div class="oferta">
    <span class="pastilla logro ok"><i class="i i-s" data-i="check"></i>Entraste como Marta Gómez</span>
    <div class="grande-dedo"><i class="i" data-i="fingerprint"></i></div>
    <h1>La próxima, con el dedo</h1>
    <p>Vinculá este celular y entrás sin Google. La huella no sale del teléfono.</p>
    <div class="cuenta">
      <div><b>4 toques</b><span>con Google</span></div>
      <div class="mejor"><b>0 toques</b><span>con la huella</span></div>
    </div>
    <div class="botones">
      <button class="huella-btn"><i class="i i-l" data-i="fingerprint"></i>Vincular con mi huella</button>
      <button class="btn btn-fantasma" style="width:100%">Ahora no</button>
    </div>
  </div>
  <span class="home-ind"></span>
</div></figure>

<figure><figcaption>Sin permiso: el código para pedir el alta</figcaption>
<div class="celu">
  <div class="barra-estado"><span>8:46</span><span class="se"><i class="i i-s" data-i="wifi"></i></span></div>
  <div class="sinp">
    <span class="ic"><i class="i i-xl" data-i="user-x"></i></span>
    <h1>Esta cuenta no tiene permiso</h1>
    <span class="correo"><span class="g"></span>juanpablo.rios88@gmail.com</span>
    <div class="tarjeta alta">
      <span class="qr"><img src="../../_recursos/qr.svg" alt=""></span>
      <div><b>Mostrale esto a un Administrador</b><span>Lo lee con su celular y te da de alta en un toque. Después entrás con esta cuenta.</span></div>
    </div>
    <div class="botones">
      <button class="g-btn"><span class="g"></span>Probar con otra cuenta</button>
      <span class="seguro" style="justify-content:center;margin-top:8px"><i class="i i-s" data-i="shield-check"></i>No se abrió ninguna sesión</span>
    </div>
  </div>
  <span class="home-ind"></span>
</div></figure>

</div>
</body>
</html>
