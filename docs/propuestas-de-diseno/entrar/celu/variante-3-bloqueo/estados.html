<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Pantalla bloqueada · estados (celular)</title>
<link rel="stylesheet" href="../../../_comun/comun.css">
<link rel="stylesheet" href="../../_recursos/entrar.css">
<link rel="stylesheet" href="estilo.css">
<script src="../../../_comun/iconos.js"></script>
<script src="../../_recursos/iconos-extra.js"></script>
<script src="../../_recursos/entrar.js"></script>
</head>
<body style="margin:0">
<div class="fila-celus">

<figure><figcaption>Un dedo: adentro en los dos</figcaption>
<div class="celu bloqueo">
  <img class="fondo" src="../../_recursos/local-desenfocado.webp" alt="">
  <div class="barra-estado"><span>8:47</span><span class="se"><i class="i i-s" data-i="wifi"></i></span></div>
  <div class="listo">
    <span class="tilde"><i class="i" data-i="check"></i></span>
    <h1>Adentro, Marta</h1>
    <p>Se abre el Catálogo en 1 segundo.</p>
    <div class="equipos">
      <span><i class="i i-s" data-i="circle-check"></i>Este celular</span>
      <span><i class="i i-s" data-i="circle-check"></i>Compu · Caja 1</span>
    </div>
  </div>
  <span class="home-ind" style="background:#fff"></span>
</div></figure>

<figure><figcaption>Leer el código: la cámara con un toque</figcaption>
<div class="celu">
  <div class="cam">
    <div class="monitor"><div class="rayas"><i style="width:80%"></i><i style="width:60%"></i><i style="width:70%"></i><i style="width:40%"></i></div><div class="qr"><img src="../../_recursos/qr.svg" alt=""></div></div>
    <span class="mira"></span>
    <div class="apunta">Apuntá al código de la compu</div>
    <span class="redondo x"><i class="i i-l" data-i="x"></i></span>
    <span class="redondo linterna"><i class="i i-l" data-i="flashlight"></i></span>
    <div class="chip-leido"><span class="ic"><i class="i" data-i="check"></i></span><div><b>Compu del mostrador · Caja 1</b><span>Apoyá el dedo y entran las dos</span></div></div>
    
  </div>
  <span class="home-ind" style="background:#fff"></span>
</div></figure>

<figure><figcaption>Sin permiso</figcaption>
<div class="celu bloqueo">
  <img class="fondo" src="../../_recursos/local-desenfocado.webp" alt="">
  <div class="barra-estado"><span>8:47</span><span class="se"><i class="i i-s" data-i="wifi"></i></span></div>
  <div class="cab">
    <img class="logo" src="../../_recursos/logotipo-sobre-oscuro.png" alt="Ferrebress">
    <div class="hora num">8:47</div>
    <div class="fecha">Lunes 19 de octubre</div>
  </div>
  <div class="no">
    <div class="t"><span class="ic"><i class="i" data-i="user-x"></i></span>Esta cuenta no puede entrar</div>
    <span class="correo"><span class="g"></span>juanpablo.rios88@gmail.com</span>
    <p>Nadie la autorizó todavía. Pedile el alta a un Administrador y volvé a entrar con esta cuenta.</p>
    <button class="g-btn"><span class="g"></span>Probar con otra cuenta</button>
  </div>
  <span class="home-ind" style="background:#fff"></span>
</div></figure>

</div>
</body>
</html>
