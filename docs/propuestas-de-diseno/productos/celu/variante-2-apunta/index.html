<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Productos · apuntá y sabé</title>
<link rel="stylesheet" href="../../../_comun/comun.css">
<script src="../../../_comun/iconos.js"></script>
<script src="../../iconos-extra.js"></script>
<script src="../../ean.js"></script>
<style>
  body { width: 390px; }
  .celu { background: #0E1412; }
  .camara { position: absolute; inset: 0 0 auto 0; height: 470px; background: radial-gradient(120% 80% at 50% 45%, #3A3F3B 0%, #1C211F 55%, #0E1412 100%); overflow: hidden; }
  .camara .obj { position: absolute; left: 50%; top: 150px; width: 300px; margin-left: -150px; transform: rotate(-6deg); filter: drop-shadow(0 30px 30px rgba(0,0,0,.6)) brightness(.92); }
  .etiq { position: absolute; left: 108px; top: 222px; width: 170px; padding: 8px 10px 6px; background: #F5F3EE; border-radius: 6px; transform: rotate(-6deg); box-shadow: 0 6px 18px rgba(0,0,0,.4); }
  .etiq .ean { width: 100%; height: 46px; fill: #111; display: block; }
  .etiq div { font-size: 14px; font-weight: 700; letter-spacing: .12em; text-align: center; color: #111; }
  .marco { position: absolute; left: 82px; top: 196px; width: 226px; height: 130px; }
  .marco i { position: absolute; width: 34px; height: 34px; border: 4px solid #fff; }
  .marco i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-radius: 12px 0 0 0; }
  .marco i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-radius: 0 12px 0 0; }
  .marco i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 12px; }
  .marco i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-radius: 0 0 12px 0; }
  .marco.leido i { border-color: #5BD69A; }
  .controles { position: absolute; top: 52px; left: 16px; right: 16px; display: flex; align-items: center; gap: 8px; }
  .redondo { width: 48px; height: 48px; border-radius: 99px; background: rgba(255,255,255,.14); color: #fff; display: grid; place-items: center; backdrop-filter: blur(10px); }
  .modos { flex: 1; display: flex; padding: 4px; border-radius: 99px; background: rgba(255,255,255,.14); backdrop-filter: blur(10px); }
  .modos span { flex: 1; height: 40px; border-radius: 99px; display: grid; place-items: center; color: rgba(255,255,255,.82); font-weight: 700; font-size: 15px; }
  .modos span.el { background: #fff; color: var(--tinta); }
  .leyenda { position: absolute; top: 120px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.8); font-weight: 600; font-size: 15px; }
  .barra-estado { color: #fff; position: relative; z-index: 2; }
  .barra-estado svg rect { stroke: #fff; fill: #fff; }
  .hoja { position: absolute; left: 0; right: 0; bottom: 0; height: 430px; background: var(--fondo); border-radius: 28px 28px 0 0; box-shadow: 0 -20px 40px -10px rgba(0,0,0,.5); padding: 10px 16px 0; display: grid; gap: 12px; align-content: start; }
  .agarre { width: 44px; height: 5px; border-radius: 99px; background: var(--borde-fuerte); margin: 0 auto 2px; }
  .quien { display: grid; grid-template-columns: 56px minmax(0,1fr) auto; gap: 12px; align-items: center; }
  .quien .n { font-weight: 800; font-size: 16px; line-height: 21px; text-transform: uppercase; }
  .precio-g { display: flex; align-items: flex-end; justify-content: space-between; }
  .precio-g .t-total { font-size: 52px; line-height: 54px; }
  .respuestas { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
  .resp { padding: 10px 12px; border-radius: 14px; background: var(--superficie); border: 1px solid var(--borde); box-shadow: var(--sombra-1); }
  .resp .et { font-size: 14px; line-height: 18px; color: var(--texto-2); font-weight: 600; display: flex; gap: 6px; align-items: center; }
  .resp .va { font-size: 18px; line-height: 24px; font-weight: 800; }
  .resp.logro { background: var(--logro-suave); border-color: transparent; } .resp.logro .va { color: var(--logro-texto); }
  .acc { display: grid; grid-template-columns: 1fr 56px; gap: 8px; }
  .recientes { display: flex; gap: 8px; overflow: hidden; }
  .reciente { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px 0 4px; border-radius: 99px; background: var(--superficie); border: 1px solid var(--borde); font-size: 14px; font-weight: 650; }
  .reciente .foto { width: 32px; height: 32px; border-radius: 99px; }
</style>
</head>
<body>
<div class="celu">
  <div class="camara">
    <img class="obj" src="../../../_comun/fotos/cinta-metrica.webp" alt="">
    <div class="etiq"><svg class="ean" data-ean="7897065211580"></svg><div>7897065211580</div></div>
    <div class="marco leido"><i></i><i></i><i></i><i></i></div>
    <div class="controles">
      <span class="redondo"><i class="i i-l" data-i="x"></i></span>
      <div class="modos"><span class="el">Consultar</span><span>Código</span><span>Foto</span></div>
      <span class="redondo"><i class="i i-l" data-i="flashlight"></i></span>
    </div>
    <div class="leyenda">Apuntá a cualquier producto</div>
  </div>
  <div class="barra-estado"><span>10:42</span><span class="se"><i class="i i-s" data-i="wifi"></i><svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" opacity=".5"/><rect x="2" y="2" width="16" height="9" rx="2"/></svg></span></div>

  <div class="hoja">
    <div class="agarre"></div>
    <div class="quien">
      <div class="foto"><img src="../../../_comun/fotos/cinta-metrica.webp" alt=""></div>
      <div style="min-width:0"><div class="n">Cinta métrica PowerLock 5 m</div><div class="t-detalle">Stanley · Cód. 33-158</div></div>
      <span class="redondo" style="background:var(--superficie);color:var(--tinta);border:1px solid var(--borde);width:44px;height:44px"><i class="i" data-i="chevron-up"></i></span>
    </div>
    <div class="precio-g">
      <div class="t-total"><span class="peso">$</span>17.000</div>
      <div style="text-align:right;padding-bottom:6px"><div class="t-etiqueta" style="color:var(--logro-texto)">margen 50 %</div><div class="t-detalle">subió $1.000 el 06/10</div></div>
    </div>
    <div class="respuestas">
      <div class="resp logro"><div class="et"><i class="i i-s" data-i="package"></i>Hay</div><div class="va">6 un.</div></div>
      <div class="resp"><div class="et"><i class="i i-s" data-i="map-pin"></i>Está en</div><div class="va">B-02-07</div></div>
      <div class="resp"><div class="et"><i class="i i-s" data-i="truck"></i>Costo</div><div class="va">$9.350</div></div>
    </div>
    <div class="acc"><button class="btn btn-accion grande"><i class="i" data-i="shopping-cart"></i>Agregar a la venta</button><button class="btn grande btn-icono" style="width:56px" title="Ficha completa"><i class="i" data-i="file-text"></i></button></div>
    <div>
      <div class="t-etiqueta" style="margin-bottom:8px">Consultaste antes</div>
      <div class="recientes">
        <span class="reciente"><span class="foto"><img src="../../../_comun/fotos/mecha.webp" alt=""></span>Mecha 8 mm · $7.000</span>
        <span class="reciente"><span class="foto"><img src="../../../_comun/fotos/tarugos.webp" alt=""></span>Tarugos S8 · sin precio</span>
      </div>
    </div>
  </div>
  <span class="home-ind"></span>
</div>
</body>
</html>
