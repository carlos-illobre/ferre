[project]
name = "listas-de-proveedores"
version = "0.1.0"
description = "Lee listas de precios de proveedores (Excel, PDF) y devuelve filas normalizadas"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openpyxl>=3.1",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["listas_de_proveedores"]

[tool.pytest.ini_options]
testpaths = ["tests"]
