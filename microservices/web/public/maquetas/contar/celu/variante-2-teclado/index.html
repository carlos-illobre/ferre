<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contar · Escaneá y tecleá (celular)</title>
<link rel="stylesheet" href="../../../_comun/comun.css">
<script src="../../../_comun/iconos.js"></script>
<script src="../../iconos-extra.js"></script>
<link rel="stylesheet" href="../../interacciones.css">
<script src="../../../_comun/navegar.js" defer></script>
<style>
  body { width: 390px; background: #0B110F; }
  .celu { background: var(--fondo); }
  .visor { position: absolute; inset: 0 0 auto 0; height: 300px; background: radial-gradient(120% 90% at 50% 55%, #4a4038 0%, #2a2420 50%, #120f0d 100%); overflow: hidden; }
  .visor .objeto { position: absolute; left: 50%; top: 104px; width: 180px; margin-left: -90px; transform: rotate(-6deg); filter: drop-shadow(0 14px 14px rgba(0,0,0,.55)) saturate(.9); }
  .visor .velo { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.5), transparent 40%, transparent 75%, rgba(0,0,0,.35)); }
  .marco { position: absolute; left: 92px; right: 92px; top: 108px; height: 124px; }
  .marco i { position: absolute; width: 28px; height: 28px; border: 4px solid var(--logro); }
  .marco .a { left: 0; top: 0; border-right: 0; border-bottom: 0; border-radius: 12px 0 0 0; }
  .marco .b { right: 0; top: 0; border-left: 0; border-bottom: 0; border-radius: 0 12px 0 0; }
  .marco .c { left: 0; bottom: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 12px; }
  .marco .d { right: 0; bottom: 0; border-left: 0; border-top: 0; border-radius: 0 0 12px 0; }
  .tope { position: absolute; top: 44px; left: 0; right: 0; display: flex; align-items: center; gap: 8px; padding: 6px 16px; }
  .redondo { width: 44px; height: 44px; border-radius: 99px; background: rgba(0,0,0,.42); backdrop-filter: blur(10px); color: #fff; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.18); flex: none; }
  .sector { flex: 1; height: 44px; border-radius: 99px; background: rgba(0,0,0,.42); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.18); color: #fff; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-weight: 750; font-size: 15px; }
  .sector .mini { flex: 1; height: 6px; border-radius: 9px; background: rgba(255,255,255,.22); overflow: hidden; }
  .sector .mini b { display: block; height: 100%; width: 39%; background: #fff; border-radius: 9px; }
  .sector .num { font-size: 14px; opacity: .9; }

  .hoja { position: absolute; left: 0; right: 0; top: 276px; bottom: 0; padding-bottom: 30px !important; background: var(--fondo); border-radius: 24px 24px 0 0; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 10px; }
  .prod { display: grid; grid-template-columns: 56px minmax(0,1fr); gap: 12px; align-items: center; }
  .prod .n { font-weight: 800; font-size: 17px; line-height: 22px; }
  .prod .d { font-size: 14px; color: var(--texto-2); }
  .pantallita { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 16px; border-radius: 16px; background: #fff; border: 2px solid var(--pino); box-shadow: 0 0 0 4px rgba(18,56,47,.10); }
  .pantallita .q { font-size: 44px; line-height: 52px; font-weight: 800; letter-spacing: -.03em; }
  .pantallita .u { font-size: 18px; font-weight: 700; color: var(--texto-2); }
  .pantallita .antes { margin-left: auto; text-align: right; line-height: 18px; padding-right: 8px; }
  .pantallita .antes b { display: block; font-size: 14px; color: var(--pino-texto); }
  .pantallita .antes span { font-size: 14px; color: var(--texto-2); }
  .teclado { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tecla { height: 56px; border-radius: 14px; background: #fff; border: 1px solid var(--borde); box-shadow: 0 1px 0 var(--borde-fuerte); display: grid; place-items: center; font-size: 26px; font-weight: 700; }
  .tecla.suave { background: var(--hundido); border-color: transparent; box-shadow: none; color: var(--texto-2); }
  .tecla.apretada { background: var(--pino-suave); transform: scale(.97); }
  .sig { display: grid; grid-template-columns: 1fr 64px; gap: 8px; }
  .ultimo { order: -1; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--texto-2); font-weight: 600; white-space: nowrap; overflow: hidden; }
  .ultimo b { color: var(--urgente-texto); }
</style>
</head>
<body>
<div class="celu">
  <div class="visor">
    <img class="objeto" src="../../../_comun/fotos/tarugos.webp" alt="">
    <div class="velo"></div>
    <span class="pastilla" style="position:absolute;left:16px;bottom:34px;background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.2)"><i class="i i-s" data-i="zap"></i>Ráfaga: cada pitido suma 1</span>
    <div class="marco"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div>
  </div>
  <div class="barra-estado" style="position:relative;color:#fff"><span>10:42</span><span class="se"><i class="i i-s" data-i="wifi"></i><svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#fff" opacity=".5"/><rect x="2" y="2" width="16" height="9" rx="2" fill="#fff"/></svg></span></div>
  <div class="tope">
    <span class="redondo"><i class="i" data-i="x"></i></span>
    <div class="sector"><span>Tornillería</span><span class="mini"><b></b></span><span class="num">25/64</span></div>
    <span class="redondo"><i class="i" data-i="list-todo"></i></span>
  </div>

  <div class="hoja">
    <div class="prod"><div class="foto"><img src="../../../_comun/fotos/tarugos.webp" alt=""></div><div style="min-width:0"><div class="n">Tarugos nylon S8 con tope × 100</div><div class="d">Fischer · Cód. 7780-S8</div></div></div>
    <div class="pantallita"><span class="q num">9</span><span class="cursor" style="height:40px;margin-left:-6px"></span><span class="u">un.</span><div class="antes"><b><i class="i i-s" data-i="history"></i> Antes 8</b><span>ayer 17:22</span></div></div>
    <div class="teclado" style="margin-top:auto">
      <span class="tecla">1</span><span class="tecla">2</span><span class="tecla">3</span>
      <span class="tecla">4</span><span class="tecla">5</span><span class="tecla">6</span>
      <span class="tecla">7</span><span class="tecla">8</span><span class="tecla apretada">9</span>
      <span class="tecla suave" style="font-size:16px;font-weight:750">No hay</span><span class="tecla">0</span><span class="tecla suave"><i class="i i-l" data-i="delete"></i></span>
    </div>
    <div class="sig"><button class="btn btn-accion grande" style="height:60px">Listo, escaneá el próximo</button><button class="btn btn-oscuro grande btn-icono" style="width:64px;height:60px"><i class="i i-l" data-i="search"></i></button></div>
    <div class="ultimo"><i class="i i-s" data-i="check" style="color:var(--logro)"></i>Recién: Tornillo T2 8 × 1/2" · 12 un. <b>−2</b></div>
  </div>
  <span class="home-ind"></span>
</div>
<style>
  .visor, .tope .redondo, .tope .sector, .ultimo, .visor .pastilla { cursor: pointer; }
  .visor .objeto { transition: opacity 200ms var(--curva); }
  .marco { transition: transform 260ms var(--curva); }
  .marco i { transition: border-color 160ms; }
  .marco.buscando i { border-color: #fff; }
  .marco.leido { transform: scale(.86); }
  .pantallita .q.vacia { color: var(--texto-3); }
  .visor .pastilla.encendida { background: var(--logro) !important; border-color: var(--logro) !important; }
  .cc-r { display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 6px 10px 6px 6px; background: #fff; border: 1px solid var(--borde); border-radius: 12px; }
  .cc-r + .cc-r { margin-top: 6px; }
  .cc-r .n { font-weight: 700; font-size: 14px; line-height: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cc-r .d { font-size: 14px; color: var(--texto-2); line-height: 18px; }
  .cc-r b { font-size: 16px; font-weight: 800; }
  .ig { color: var(--logro-texto); } .menos { color: var(--urgente-texto); } .mas { color: var(--pino-texto); }
</style>
<script src="../../interacciones.js"></script>
<script>
/* Contar · celu 2: la cámara siempre abierta y el teclado. Tecleá, «Listo» y la cámara lee el próximo. */
(function () {
  var C = window.Contar, $ = function (s, r) { return (r || document).querySelector(s); }, $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var hoja = $(".hoja"), pq = $(".pantallita .q"), marco = $(".marco"), objeto = $(".visor .objeto");
  var S = { n: "Pared de tornillería", corto: "Tornillería", contados: 25, total: 64,
    lista: [{ n: "Tornillo autoperforante T2 8 × 1/2\" × 100", f: "tornillos", m: "Bulonera Centro · Cód. T2812", c: 12, s: 14, u: "un." }, { n: "Clavos punta París 2\" a granel", f: "clavos", m: "Acindar · se cuenta en kg", c: 7.2, s: 6.5, u: "kg" }, { n: "Arandela plana zincada 1/4\" × 100", f: "", m: "Bulonera Centro · Cód. AP14", c: 6, s: 6, u: "un." }, { n: "Tornillo fixer 8 mm con tarugo × 50", f: "tornillos", m: "Fischer · Cód. FX8", c: 0, s: 3, u: "un." }],
    ocultas: [{ n: "Tornillo T2 8 × 3/4\" × 100", c: 10, h: 11 }, { n: "Tarugos nylon S5 × 100", c: 15, h: 13 }] };
  S.pend = C.productos(S.n).slice();
  var elegido = { n: "Tarugos nylon S8 con tope × 100", m: "Fischer · Cód. 7780-S8", f: "tarugos", s: 8, u: "un.", antes: 8 }, q = "9", rafaga = false, esperando = false, ultimo = S.lista[0];

  function pintarQ() { pq.textContent = q === "" ? "0" : q; pq.classList.toggle("vacia", q === ""); }
  function pintarSector() {
    $(".sector span").textContent = S.corto;
    $(".sector .num").textContent = S.contados + "/" + S.total;
    $(".sector .mini b").style.width = (S.total ? S.contados / S.total * 100 : 0) + "%";
  }
  function mostrar(p) {
    elegido = p; q = p.antes != null ? C.fmt(p.antes) : "";
    $(".prod").innerHTML = C.foto(p.f) + '<div style="min-width:0"><div class="n">' + p.n + '</div><div class="d">' + p.m + "</div></div>";
    $(".pantallita .u").textContent = p.u;
    $(".pantallita .antes").innerHTML = p.antes != null ? '<b><i class="i i-s" data-i="history"></i> Antes ' + C.fmt(p.antes) + "</b><span>hoy 10:42</span>" : "<b>Sin contar</b><span>todavía</span>";
    C.pintar(hoja); pintarQ();
    // la tarjeta del producto se cruza desde abajo
    C.mover($(".prod"), [{ opacity: 0, transform: "translateY(24px)" }, { opacity: 1, transform: "none" }], 320);
    if (p.antes != null) C.rebotar($(".pantallita .antes"));
  }
  // Leer el próximo: las esquinas se cierran sobre el código y se ponen verdes.
  function leer(p) {
    if (!p) { C.tostada("No queda nada sin contar en " + S.corto, "info"); return; }
    esperando = true; marco.classList.remove("leido"); marco.classList.add("buscando");
    if (p.f) { objeto.src = C.FOTOS + p.f + ".webp"; objeto.style.opacity = 1; } else objeto.style.opacity = 0;
    clearTimeout(leer.t);
    leer.t = setTimeout(function () { esperando = false; marco.classList.remove("buscando"); marco.classList.add("leido"); C.vibrar(10); mostrar(p); }, 900);
  }
  function listo() {
    if (q === "" || esperando) { C.mover($(".pantallita"), [{ transform: "translateX(-4px)" }, { transform: "translateX(4px)" }, { transform: "none" }], 200); return; }
    var p = elegido, c = parseFloat(q.replace(",", ".")), reg = { n: p.n, m: p.m, f: p.f, s: p.s, u: p.u, c: c };
    var ya = S.lista.some(function (x) { return x.n === p.n; });
    S.lista = S.lista.filter(function (x) { return x.n !== p.n; }); S.lista.unshift(reg); S.pend = S.pend.filter(function (x) { return x.n !== p.n; });
    if (!ya) { S.contados = Math.min(S.total, S.contados + 1); C.rodar($(".sector .num"), S.contados + "/" + S.total, true); $(".sector .mini b").style.width = (S.contados / S.total * 100) + "%"; }
    ultimo = reg; var d = C.dif(c, p.s);
    $(".ultimo").innerHTML = '<i class="i i-s" data-i="check" style="color:var(--logro)"></i>Recién: ' + p.n.replace(" con tope", "") + " · " + C.fmt(c) + " " + p.u + ' <b style="color:var(--' + (d.c === "menos" ? "urgente" : d.c === "mas" ? "pino" : "logro") + '-texto)">' + d.t + "</b>";
    C.pintar($(".ultimo")); C.mover($(".ultimo"), [{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }], 320, "cubic-bezier(.34,1.4,.64,1)");
    C.mover($(".prod"), [{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(-16px)" }], 160);
    q = ""; pintarQ(); C.vibrar(10);
    leer(S.pend[0]);
  }
  // Teclado propio.
  $(".teclado").addEventListener("click", function (e) {
    var t = e.target.closest(".tecla"); if (!t) return;
    $$(".tecla.apretada").forEach(function (x) { x.classList.remove("apretada"); });
    C.apretar(t); C.vibrar(5);
    var k = t.textContent.trim();
    if (k === "No hay") { q = "0"; pintarQ(); setTimeout(listo, 150); return; }
    if (t.querySelector("svg") || k === "") q = q.slice(0, -1);
    else if (q.length < 5) { q = (q === "0" ? "" : q) + k; C.mover(pq, [{ transform: "translateY(30%)", opacity: .2 }, { transform: "none", opacity: 1 }], 120); }
    pintarQ();
  });
  $(".sig .btn-accion").addEventListener("click", listo);
  // Tocar el visor: con ráfaga suma 1; si no, lee el código ahora.
  $(".visor").addEventListener("click", function (e) {
    if (e.target.closest(".pastilla")) return;
    if (rafaga) { q = String((parseInt(q || "0", 10) || 0) + 1); pintarQ(); C.vibrar(10); marco.classList.add("leido"); C.rebotar(pq); return; }
    if (esperando) { clearTimeout(leer.t); esperando = false; marco.classList.remove("buscando"); marco.classList.add("leido"); C.vibrar(10); mostrar(S.pend[0]); }
  });
  $(".visor .pastilla").addEventListener("click", function () {
    rafaga = !rafaga; var p = $(".visor .pastilla"); p.classList.toggle("encendida", rafaga);
    p.lastChild.textContent = rafaga ? "Ráfaga encendida: tocá o escaneá" : "Ráfaga: cada pitido suma 1";
    C.tostada(rafaga ? "Ráfaga: cada pitido suma 1 a este producto" : "Ráfaga apagada", "zap");
  });
  // «Recién»: tocá para corregir el último.
  $(".ultimo").addEventListener("click", function () { if (ultimo) mostrar({ n: ultimo.n, m: ultimo.m, f: ultimo.f, s: ultimo.s, u: ultimo.u, antes: ultimo.c }); });

  // Buscar a mano.
  $(".sig .btn-oscuro").addEventListener("click", function () {
    var todos = S.pend.concat(S.lista.map(function (x) { return { n: x.n, m: x.m, f: x.f, s: x.s, u: x.u, antes: x.c }; }));
    var h = C.hoja('<div class="campo foco"><i class="i" data-i="search"></i><input autofocus placeholder="Nombre o código" style="border:0;outline:0;flex:1;font-weight:600;background:none;min-width:0"></div><div class="cx-res" style="display:grid;gap:2px"></div><button class="btn btn-fantasma" data-cerrar>Cancelar</button>');
    var inp = $("input", h), res = $(".cx-res", h);
    function lista() {
      var t = inp.value.toLowerCase();
      res.innerHTML = todos.filter(function (p) { return !t || (p.n + p.m).toLowerCase().indexOf(t) >= 0; }).slice(0, 6).map(function (p) { return '<button class="cx-op" data-k="' + todos.indexOf(p) + '">' + C.foto(p.f, true) + '<span class="txt">' + p.n + "</span></button>"; }).join("");
      C.pintar(res);
    }
    lista(); inp.addEventListener("input", lista);
    res.addEventListener("click", function (e) { var b = e.target.closest("[data-k]"); if (!b) return; C.cerrar(C.capaDe(h)); clearTimeout(leer.t); esperando = false; mostrar(todos[+b.getAttribute("data-k")]); });
  });

  // Lo contado y lo que falta del sector.
  function fila(p, sin) {
    if (sin) return '<div class="cc-r" data-k="' + S.pend.indexOf(p) + '">' + C.foto(p.f, true) + '<div style="min-width:0"><div class="n">' + p.n + '</div><div class="d">' + p.m + '</div></div><i class="i i-s" data-i="chevron-right" style="color:var(--texto-3)"></i></div>';
    var d = C.dif(p.c, p.s); return '<div class="cc-r">' + C.foto(p.f, true) + '<div style="min-width:0"><div class="n">' + p.n + '</div><div class="d">' + C.fmt(p.c) + " " + p.u + " · había " + C.fmt(p.s) + '</div></div><b class="' + d.c + ' num">' + d.t + "</b></div>";
  }
  $$(".tope .redondo")[1].addEventListener("click", function () {
    var h = C.hoja(C.cabeza(S.n, S.contados + " de " + S.total + " contados") +
      '<div class="cc-lista-cab t-renglon">Sin contar · ' + (S.total - S.contados) + '</div><div>' + S.pend.slice(0, 3).map(function (p) { return fila(p, true); }).join("") + "</div>" +
      '<div class="cc-lista-cab t-renglon">Contados · el último arriba</div><div>' + S.lista.slice(0, 3).map(function (p) { return fila(p); }).join("") + "</div>" +
      '<div class="cx-celu-botones"><button class="btn grande" data-cierre><i class="i" data-i="square-check-big"></i>Cerrar el sector</button></div>');
    h.addEventListener("click", function (e) {
      var r = e.target.closest("[data-k]"); if (r) { C.cerrar(C.capaDe(h)); clearTimeout(leer.t); esperando = false; mostrar(S.pend[+r.getAttribute("data-k")]); }
      if (e.target.closest("[data-cierre]")) { C.cerrar(C.capaDe(h)); setTimeout(cierre, 200); }
    });
  });
  // La ×: pausar o cerrar.
  $$(".tope .redondo")[0].addEventListener("click", function () {
    var h = C.hoja(C.cabeza("¿Dejás de contar?", S.n + " · " + S.contados + " de " + S.total) +
      '<div class="cx-celu-botones"><button class="btn btn-accion grande" data-cierre>Cerrar el sector</button><button class="btn grande" data-pausa><i class="i" data-i="pause"></i>Pausar y seguir después</button><button class="btn btn-fantasma" data-cerrar>Seguir contando</button></div>');
    h.addEventListener("click", function (e) {
      if (e.target.closest("[data-cierre]")) { C.cerrar(C.capaDe(h)); setTimeout(cierre, 200); }
      if (e.target.closest("[data-pausa]")) { C.cerrar(C.capaDe(h)); C.tostada("En pausa: " + S.contados + " de " + S.total + " · lo seguís desde Contar", "pause"); }
    });
  });
  // Cerrar el sector: la hoja de la variante 4.
  function cierre() {
    var difs = S.lista.filter(function (x) { return x.c !== x.s; }).map(function (x) { return { n: x.n, c: x.c, h: x.s }; }).concat(S.ocultas);
    var sin = []; for (var i = 0; i < S.total - S.contados; i++) sin.push(S.pend[i] || { f: "" });
    C.cierre({ sector: S.n, contados: S.contados, difs: difs, sinContar: sin, hora: "10:45", alCerrar: function () {
      C.tostada(S.n + " cerrado · elegí otro sector"); setTimeout(elegirSector, 600);
    } });
  }
  // Abrir otro sector desde la pastilla de arriba.
  var SECT = [["Pared de tornillería", "Tornillería", 25, 64], ["Exhibidor de mechas y puntas", "Mechas", 8, 46], ["Pared de electricidad", "Electricidad", 0, 37], ["Cajones de bulones", "Bulones", 0, 120], ["Jardín y riego", "Jardín", 0, 33]];
  $(".tope .sector").addEventListener("click", elegirSector);
  function elegirSector() {
    var h = C.hoja(C.cabeza("Elegí el sector", "Lo contado queda guardado") + '<div style="display:grid;gap:2px">' + SECT.map(function (s, i) {
      return '<button class="cx-op" data-s="' + i + '"><i class="i" data-i="' + (s[2] ? "pause" : "circle-dashed") + '"></i><span class="txt">' + s[0] + '</span><span class="t-detalle">' + (s[2] ? s[2] + " de " + s[3] : "nunca") + "</span></button>";
    }).join("") + "</div>");
    h.addEventListener("click", function (e) {
      var b = e.target.closest("[data-s]"); if (!b) return; var s = SECT[+b.getAttribute("data-s")]; C.cerrar(C.capaDe(h));
      if (s[0] === S.n) return;
      SECT.forEach(function (x) { if (x[0] === S.n) x[2] = S.contados; });
      S = { n: s[0], corto: s[1], contados: s[2], total: s[3], lista: [], ocultas: [], pend: C.productos(s[0]).slice() };
      pintarSector(); C.rebotar($(".tope .sector")); leer(S.pend[0]);
      C.tostada("Abriste " + s[0], "list-todo");
    });
  }
})();
</script>
</body>
</html>
