<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Mostrador · estados (celular)</title>
<link rel="stylesheet" href="../../../_comun/comun.css">
<link rel="stylesheet" href="../../_recursos/entrar.css">
<link rel="stylesheet" href="estilo.css">
<link rel="stylesheet" href="../../_recursos/interacciones.css">
<script src="../../../_comun/iconos.js"></script>
<script src="../../_recursos/iconos-extra.js"></script>
<script src="../../_recursos/entrar.js"></script>
<script src="../../../_comun/navegar.js" defer></script>
</head>
<body style="margin:0">
<div class="fila-celus">

<figure><figcaption>Después de Google: la oferta, una vez</figcaption>
<div class="celu">
  <div class="barra-estado"><span>8:46</span><span class="se"><i class="i i-s" data-i="wifi"></i></span></div>
  <div class="celu-cabecera"><span class="t-titulo">Catálogo</span></div>
  <nav class="celu-pestanas"><a class="activa" data-ir="productos">Productos</a><a data-ir="listas">Listas</a><a data-ir="duplicados">Duplicados</a></nav>
  <div class="celu-pantalla"><div class="renglon"><span class="foto"><img src="../../../_comun/fotos/martillo.webp"></span><div><div class="titulo">Martillo carpintero 27 mm</div><div class="detalle">Bahco · MC27</div></div></div><div class="renglon"><span class="foto"><img src="../../../_comun/fotos/mecha.webp"></span><div><div class="titulo">Mecha acero rápido HSS 8 mm</div><div class="detalle">Ezeta · ME080</div></div></div></div>
  <div class="velo"></div>
  <div class="hoja">
    <span class="asa"></span>
    <span class="pulso"><i class="i" data-i="fingerprint" style="width:52px;height:52px"></i></span>
    <h2>¿Entrar con la huella?</h2>
    <p>La próxima vez entrás con el dedo, sin Google. Y con la compu: leés su código y listo.</p>
    <div class="cosas">
      <span><i class="i" data-i="check"></i>Tu huella no sale de este celular</span>
      <span><i class="i" data-i="check"></i>La podés quitar en Más → Configuración</span>
    </div>
    <button class="huella-btn">Sí, usar la huella</button>
    <button class="btn btn-fantasma">Ahora no</button>
  </div>
  <span class="home-ind"></span>
</div></figure>

<figure><figcaption>Sin permiso</figcaption>
<div class="celu">
  <div class="barra-estado"><span>8:46</span><span class="se"><i class="i i-s" data-i="wifi"></i></span></div>
  <div class="entrada">
    <div class="marca-c" style="margin:40px 0 24px"><img src="../../_recursos/logotipo-claro.png" alt="Ferrebress"></div>
    <div class="tarjeta-2 panel">
      <div class="rechazo">
        <div class="t"><span class="ic"><i class="i" data-i="user-x"></i></span>Esta cuenta no tiene permiso para entrar</div>
        <span class="correo"><span class="g"></span>juanpablo.rios88@gmail.com</span>
        <p>Pedile a un Administrador que te dé de alta. Después entrás con esta misma cuenta.</p>
      </div>
      <button class="g-btn ancho"><span class="g"></span>Probar con otra cuenta</button>
      <button class="btn btn-suave" style="width:100%"><i class="i" data-i="share-2"></i>Avisarle al Administrador</button>
    </div>
    <div class="abajo"><span class="seguro"><i class="i i-s" data-i="shield-check"></i>No se abrió ninguna sesión</span></div>
  </div>
  <span class="home-ind"></span>
</div></figure>

<figure><figcaption>Leído el código de la compu</figcaption>
<div class="celu">
  <div class="camara">
    <div class="pantalla-compu"><div class="qr"><img src="../../_recursos/qr.svg" alt=""></div></div>
    <div class="marco-lectura"><b></b><b></b><b></b><b></b></div>
    <span class="cerrar"><i class="i" data-i="x"></i></span>
    <div class="leyenda">Código de la compu leído</div>
  </div>
  <div class="hoja" style="padding-top:12px">
    <span class="asa"></span>
    <div class="quien" style="width:100%;text-align:left">
      <span class="ic" style="width:48px;height:48px;border-radius:12px;background:var(--pino-suave);color:var(--pino-texto);display:grid;place-items:center"><i class="i i-l" data-i="monitor"></i></span>
      <div><b>Compu del mostrador · Caja 1</b><span>Entra con tu usuario apenas pongas la huella</span></div>
    </div>
    <span class="pulso" style="width:80px;height:80px;background:var(--accion-suave);color:var(--accion);margin:24px 0 8px"><i class="i" data-i="fingerprint" style="width:44px;height:44px"></i></span><b style="font-size:18px">Poné el dedo: entrás acá y en la compu</b>
    <button class="btn btn-fantasma">Usar Google</button>
  </div>
  <span class="home-ind" style="background:#1A1D1B"></span>
</div></figure>

</div>
<script src="../../_recursos/interacciones.js"></script>
<script>Entrar.iniciar("celu-1");</script>
</body>
</html>
