<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Cartel del local (computadora)</title>
<link rel="stylesheet" href="../../../_comun/comun.css">
<link rel="stylesheet" href="../../_recursos/entrar.css">
<link rel="stylesheet" href="estilo.css">
<link rel="stylesheet" href="../../_recursos/interacciones.css">
<script src="../../../_comun/iconos.js"></script>
<script src="../../_recursos/iconos-extra.js"></script>
<script src="../../_recursos/entrar.js"></script>
<script src="../../../_comun/navegar.js" defer></script>
</head>
<body>
<div class="escena">
  <img class="fondo" src="../../_recursos/local.webp" alt="">
  <div class="capa">
    <div class="izq">
      <img class="logo" src="../../_recursos/logotipo-sobre-oscuro.png" alt="Ferrebress">
      <div class="cartel">
        <div class="hora num">8:47</div>
        <div class="fecha">Lunes 19 de octubre</div>
        <div class="abierto"><span class="p"></span>Abierto hasta las 20 · te atendemos enseguida</div>
      </div>
      <div class="cinta">
        <span><i class="i" data-i="shield-check"></i>Sin contraseñas</span>
        <span><i class="i" data-i="lock"></i>Sin sesión no se ve ningún dato del negocio</span>
        <span><i class="i" data-i="wifi"></i>En línea</span>
      </div>
    </div>
    <div class="der">
      <div class="tarjeta-qr">
        <h1>Apuntá tu celular y poné la huella</h1>
        <div class="qr" style="position:relative">
          <img src="../../_recursos/qr.svg" alt="">
          <span class="centro"><img src="../../_recursos/isotipo-claro.png" alt=""></span>
        </div>
        <div class="linea">
          <span class="gesto"><b><i class="i" data-i="scan-line"></i>Leer</b><i class="i i-s flecha" data-i="arrow-right"></i><b><i class="i" data-i="fingerprint"></i>Huella</b><i class="i i-s flecha" data-i="arrow-right"></i><b>Listo</b></span>
          <span class="vence"><svg class="anillo" viewBox="0 0 20 20"><circle class="f" cx="10" cy="10" r="8"/><circle class="v" cx="10" cy="10" r="8" stroke-dasharray="50.3" stroke-dashoffset="8"/></svg><span class="num">4:12</span></span>
        </div>
        <button class="g-btn"><span class="g"></span>Continuar con Google</button>
      </div>
    </div>
  </div>
</div>
<script src="../../_recursos/interacciones.js"></script>
<script>Entrar.iniciar("compu-3");</script>
