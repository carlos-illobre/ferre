<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mejoras y errores · Sacudí y marcá (celular)</title>
<link rel="stylesheet" href="../../../_comun/comun.css">
<link rel="stylesheet" href="../../mye.css">
<script src="../../../_comun/iconos.js"></script>
<script src="../../iconos-extra.js"></script>
<link rel="stylesheet" href="../../interacciones.css">
<script src="../../../_comun/navegar.js" defer></script>
<style>
  body { width: 390px; background: var(--pino); }
  .celu { background: radial-gradient(120% 70% at 50% 25%, var(--pino-2) 0%, var(--pino) 60%, #0B1F1A 100%); color: #fff; }
  .barra-estado { color: #fff; }
  .tope { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 4px 16px 0; }
  .redondo { width: 44px; height: 44px; border-radius: 99px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); display: grid; place-items: center; color: #fff; }
  .tope .t { text-align: center; font-weight: 800; font-size: 17px; line-height: 22px; }
  .tope .s { text-align: center; font-size: 14px; color: rgba(255,255,255,.75); font-weight: 600; }
  .lienzo { position: relative; margin: 16px auto 0; width: 232px; height: 324px; border-radius: 22px; overflow: hidden; box-shadow: 0 24px 48px rgba(0,0,0,.45), 0 0 0 6px rgba(255,255,255,.08); transform: rotate(-2deg); }
  .lienzo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 62%; }
  .trazo { position: absolute; color: var(--accion); left: 124px; top: 140px; width: 108px; height: 56px; }
  .tapado { position: absolute; left: 8px; top: 4px; width: 0; }
  .herram { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
  .herram span { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 99px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.16); font-weight: 700; font-size: 14px; color: rgba(255,255,255,.9); }
  .herram span.si { background: #fff; color: var(--tinta); }
  .herram .color { width: 14px; height: 14px; border-radius: 99px; background: var(--accion); }

  .hoja { position: absolute; left: 0; right: 0; bottom: 0; background: var(--fondo); color: var(--tinta); border-radius: 28px 28px 0 0; padding: 8px 16px 28px; box-shadow: 0 -16px 40px rgba(0,0,0,.35); display: grid; gap: 12px; }
  .agarre { width: 40px; height: 5px; border-radius: 9px; background: var(--hundido-2); margin: 0 auto; }
  .eleccion > * { min-height: 48px; padding: 0 12px; gap: 8px; font-size: 15px; }
  .dicho { background: var(--superficie); border: 1px solid var(--borde); border-radius: 16px; padding: 12px 14px; font-size: 17px; line-height: 25px; font-weight: 600; box-shadow: var(--sombra-1); }
  .dicho .gris { color: var(--texto-3); }
  .dicho .et { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--logro-texto); margin-bottom: 4px; }
  .onda { display: inline-flex; gap: 3px; align-items: center; height: 14px; }
  .onda b { width: 3px; border-radius: 3px; background: var(--logro); }
  .va { display: flex; gap: 8px; flex-wrap: wrap; }
  .acc { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; }
  .mic { width: 64px; height: 64px; border-radius: 99px; background: var(--pino); color: #fff; display: grid; place-items: center; box-shadow: 0 0 0 8px var(--pino-suave), var(--sombra-2); }
</style>
</head>
<body>
<div class="celu">
  <div class="barra-estado"><span>10:42</span><span class="se"><i class="i i-s" data-i="wifi"></i><svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="16" height="9" rx="2" fill="currentColor"/></svg></span></div>
  <div class="tope">
    <span class="redondo"><i class="i" data-i="x"></i></span>
    <div><div class="t">Avisar sobre Vender</div><div class="s">Sacudiste el celular · 10:42</div></div>
    <span class="redondo"><i class="i" data-i="undo-2"></i></span>
  </div>

  <div class="lienzo">
    <img src="../../imagenes/cap-vender-celu.webp" alt="">
    <svg class="trazo" viewBox="0 0 236 70" preserveAspectRatio="none" fill="none"><path d="M18 40 C 10 12, 120 2, 200 10 C 236 16, 232 52, 196 62 C 140 74, 30 70, 12 50 C 4 40, 18 26, 40 20" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>
  </div>
  <div class="herram">
    <span class="si"><span class="color"></span>Marcar</span>
    <span><i class="i i-s" data-i="eye"></i>Tapar</span>
    <span><i class="i i-s" data-i="image-plus"></i>Otra</span>
  </div>

  <div class="hoja">
    <span class="agarre"></span>
    <div class="eleccion">
      <button><i class="i" data-i="lightbulb"></i>Una idea</button>
      <button class="elegida"><i class="i" data-i="bug"></i>Un error</button>
    </div>
    <div class="dicho">
      <div class="et"><span class="onda"><b style="height:6px"></b><b style="height:12px"></b><b style="height:8px"></b><b style="height:14px"></b><b style="height:5px"></b></span>Te escucho</div>
      «Los tarugos me salen sin precio y la lista <span class="gris">de Fischer llegó ayer»</span>
    </div>
    <div class="va"><span class="pastilla contorno"><i class="i i-s" data-i="image"></i>1 captura marcada</span><span class="pastilla contorno"><i class="i i-s" data-i="smartphone"></i>Samsung A15 · 5.3.2</span></div>
    <div class="acc">
      <span class="mic"><i class="i i-xl" data-i="mic"></i></span>
      <button class="btn btn-accion grande"><i class="i" data-i="send"></i>Enviar error</button>
    </div>
  </div>
  <span class="home-ind" style="background:var(--tinta)"></span>
</div>
<script src="../../interacciones.js"></script>
<script>
/* Celu 3 · Sacudí y marcá: marcar con el dedo, dictar, mandar; × vuelve a Vender y «Sacudir»
   (o sacudir el celular de verdad) abre el aviso otra vez. */
document.addEventListener("DOMContentLoaded", function () {
  var M = MYE;
  var celu = document.querySelector(".celu"), lienzo = document.querySelector(".lienzo"), hoja = document.querySelector(".hoja");
  var tope = document.querySelector(".tope"), herr = document.querySelector(".herram");
  var redondos = tope.querySelectorAll(".redondo");
  [hoja, tope, herr, lienzo].forEach(function (x) { x.classList.add("ix-se-va"); });
  redondos.forEach(function (r) { r.style.cursor = "pointer"; });

  // ---------- Marcar con el dedo ----------
  var botones = herr.querySelectorAll("span:not(.color)");
  botones = [herr.children[0], herr.children[1], herr.children[2]];
  botones.forEach(function (b) { b.style.cursor = "pointer"; });
  var modo = "marcar";
  botones[0].addEventListener("click", function () { if (M.elegir(botones[0], "si")) modo = "marcar"; });
  botones[1].addEventListener("click", function () { if (M.elegir(botones[1], "si")) modo = "tapar"; });
  lienzo.style.touchAction = "none";
  var NS = "http://www.w3.org/2000/svg", svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 232 324"); svg.setAttribute("style", "position:absolute;inset:0;width:100%;height:100%;overflow:visible");
  lienzo.appendChild(svg);
  var hechos = [lienzo.querySelector(".trazo")], trazo = null;
  function punto(e) { var r = lienzo.getBoundingClientRect(); return [Math.round((e.clientX - r.left) * 232 / r.width), Math.round((e.clientY - r.top) * 324 / r.height)]; }
  lienzo.addEventListener("pointerdown", function (e) {
    e.preventDefault(); lienzo.setPointerCapture(e.pointerId); var p = punto(e);
    if (modo === "tapar") {
      var t = document.createElement("div"); t.style.cssText = "position:absolute;left:" + p[0] + "px;top:" + p[1] + "px;width:0;height:0;border-radius:6px;background:var(--tinta)";
      lienzo.appendChild(t); trazo = { el: t, o: p };
    } else {
      var path = document.createElementNS(NS, "path");
      path.setAttribute("fill", "none"); path.setAttribute("stroke", "#E8541C"); path.setAttribute("stroke-width", "5"); path.setAttribute("stroke-linecap", "round"); path.setAttribute("stroke-linejoin", "round");
      svg.appendChild(path); trazo = { el: path, pts: [p] }; path.setAttribute("d", "M" + p.join(" "));
    }
  });
  lienzo.addEventListener("pointermove", function (e) {
    if (!trazo) return; var p = punto(e);
    if (trazo.o) { var o = trazo.o, s = trazo.el.style; s.left = Math.min(o[0], p[0]) + "px"; s.top = Math.min(o[1], p[1]) + "px"; s.width = Math.abs(p[0] - o[0]) + "px"; s.height = Math.abs(p[1] - o[1]) + "px"; }
    else { trazo.pts.push(p); trazo.el.setAttribute("d", "M" + trazo.pts.map(function (q) { return q.join(" "); }).join(" L")); }
  });
  function soltar() {
    if (!trazo) return; var t = trazo; trazo = null;
    if (t.o) { if (parseFloat(t.el.style.width) < 8) { t.el.style.width = "90px"; t.el.style.height = "18px"; } }
    else {
      if (t.pts.length < 2) return t.el.remove();
      var p = t.pts, d = "M" + p[0].join(" ");
      for (var i = 1; i < p.length - 1; i++) d += " Q" + p[i].join(" ") + " " + (p[i][0] + p[i + 1][0]) / 2 + " " + (p[i][1] + p[i + 1][1]) / 2;
      t.el.setAttribute("d", d + " L" + p[p.length - 1].join(" "));
    }
    hechos.push(t.el); M.vibrar(10);
  }
  lienzo.addEventListener("pointerup", soltar); lienzo.addEventListener("pointercancel", soltar);
  redondos[1].addEventListener("click", function () {
    var el = hechos.pop(); if (!el) return M.sacudir(redondos[1]);
    el.style.transition = "opacity var(--t) var(--curva)"; el.style.opacity = "0"; setTimeout(function () { el.remove(); }, 220);
  });

  // ---------- Otra foto ----------
  var va = hoja.querySelector(".va .pastilla"), extras = 0;
  botones[2].addEventListener("click", function () {
    if (extras >= 4) return M.sacudir(botones[2]);
    M.galeria(function () {
      extras++; va.innerHTML = '<i class="i i-s" data-i="image"></i>1 captura marcada + ' + extras + (extras > 1 ? " fotos" : " foto"); window.pintarIconos(va);
      M.animar(va, "ix-crece", 280); M.vibrar(10);
    });
  });

  // ---------- Idea o error, y dictar ----------
  var enviar = hoja.querySelector(".acc .btn-accion"), etiqueta = document.createElement("span");
  enviar.childNodes.forEach(function (n) { if (n.nodeType === 3 && n.textContent.trim()) { etiqueta.textContent = n.textContent.trim(); enviar.replaceChild(etiqueta, n); } });
  var tipo = "error";
  hoja.querySelectorAll(".eleccion > button").forEach(function (b, k) { b.addEventListener("click", function () { if (M.elegir(b)) { tipo = k ? "error" : "idea"; M.fundir(etiqueta, k ? "Enviar error" : "Enviar idea"); M.vibrar(10); } }); });
  var dicho = hoja.querySelector(".dicho"), et = dicho.querySelector(".et"), onda = et.querySelector(".onda");
  var txt = document.createElement("span");
  while (et.nextSibling) txt.appendChild(et.nextSibling);
  dicho.appendChild(txt);
  var mic = hoja.querySelector(".mic"); mic.style.cursor = "pointer";
  var escuchando = true, reloj = null;
  function etiquetaDicho(html, color) { et.innerHTML = html; et.style.color = color || ""; window.pintarIconos(et); M.animar(et, "ix-funde", 220); }
  function parar() {
    escuchando = false; clearInterval(reloj); onda.classList.remove("ix-onda");
    txt.querySelectorAll(".gris").forEach(function (g) { g.classList.remove("gris"); });
    etiquetaDicho('<i class="i i-s" data-i="check"></i>Entendí · tocá para corregir');
    M.editable(txt, { ayuda: "Tocá el micrófono y contá qué pasó" });
  }
  var FRASES = ["«Los tarugos S8 de Fischer salen sin precio y la lista llegó ayer»", "«En Vender, el precio de los tarugos queda vacío aunque cargué la lista»", "«Que se pueda dictar la cantidad cuando cuento el depósito»"];
  var frase = 0;
  function escuchar() {
    escuchando = true; txt.removeAttribute("contenteditable"); txt.innerHTML = "";
    et.innerHTML = ""; et.appendChild(onda); et.appendChild(document.createTextNode("Te escucho")); et.style.color = "";
    onda.classList.add("ix-onda");
    var palabras = FRASES[frase++ % FRASES.length].split(" "), k = 0;
    reloj = setInterval(function () {
      if (k >= palabras.length) { clearInterval(reloj); setTimeout(function () { if (escuchando) parar(); }, 500); return; }
      var w = document.createElement("span"); w.className = "gris"; w.textContent = (k ? " " : "") + palabras[k];
      txt.appendChild(w); M.animar(w, "ix-funde", 200);
      var grises = txt.querySelectorAll(".gris"); if (grises.length > 2) grises[0].classList.remove("gris");
      k++;
    }, 180);
    M.vibrar(10);
  }
  mic.addEventListener("click", function () { if (escuchando) parar(); else escuchar(); });

  // ---------- Enviar ----------
  var listo = null;
  enviar.addEventListener("click", function () {
    if (escuchando) parar();
    if (!M.texto(txt)) { M.sacudir(dicho); return; }
    listo = M.h('<div class="ix-listo ix-funde" style="position:absolute;inset:0;background:var(--fondo);border-radius:inherit;align-content:center">' +
      '<span class="circulo ix-tilde"><i class="i" data-i="check"></i></span><div class="t-seccion">' + (tipo === "error" ? "Error enviado" : "Idea enviada") + "</div>" +
      '<div class="t-cuerpo" style="color:var(--texto-2)">Con la captura marcada y «Estaba en Vender». Te avisamos cuando se resuelva.</div></div>');
    hoja.appendChild(listo); M.vibrar([10, 40, 10]);
    setTimeout(function () { volver("Aviso enviado · seguí vendiendo"); }, 1500);
  });

  // ---------- Volver a Vender y sacudir para avisar ----------
  var vuelta = M.h('<div class="ix-vuelta" style="z-index:45"><img src="../../imagenes/cap-vender-celu.webp" alt="Vender" style="object-position:top center">' +
    '<div class="ix-pildora" style="left:12px;right:12px;bottom:100px;padding:10px 10px 10px 14px;gap:8px"><i class="i" data-i="vibrate"></i><span style="flex:1;line-height:20px;white-space:nowrap">Sacudí para avisar</span>' +
    '<button class="btn chico" data-sacudir>Sacudir</button><button class="btn chico btn-accion" data-ir="vender">Ir a Vender</button></div></div>');
  celu.appendChild(vuelta);
  var vImg = vuelta.querySelector("img"), abierto = true;
  function enLienzo() {
    var e = 232 / 390, cx = lienzo.offsetLeft + 116, cy = lienzo.offsetTop + 162;
    return "translate(" + (cx - 390 * e / 2) + "px," + (cy - 844 * e * .62) + "px) rotate(-2deg) scale(" + e + ")";
  }
  function volver(msj) {
    if (!abierto) return; abierto = false;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    vImg.style.transition = "none"; vImg.style.transform = enLienzo(); vImg.style.opacity = ".6"; vuelta.classList.add("si");
    hoja.style.transform = "translateY(100%)"; tope.style.opacity = "0"; herr.style.opacity = "0";
    requestAnimationFrame(function () { requestAnimationFrame(function () { vImg.style.transition = ""; vImg.style.transform = "none"; vImg.style.opacity = "1"; }); });
    setTimeout(function () { vuelta.classList.add("lista"); if (msj) M.tostada(msj); }, 340);
  }
  function sacudido() {
    if (abierto) return; abierto = true;
    vuelta.classList.remove("lista"); M.animar(vImg, "ix-sacude", 340); M.vibrar([10, 40, 10]);
    setTimeout(function () {
      M.destello();
      if (listo) { listo.remove(); listo = null; txt.innerHTML = ""; extras = 0; va.innerHTML = '<i class="i i-s" data-i="image"></i>1 captura marcada'; window.pintarIconos(va); escuchar(); }
      vImg.style.transform = enLienzo(); vImg.style.opacity = "0";
      hoja.style.transform = ""; tope.style.opacity = ""; herr.style.opacity = "";
      setTimeout(function () { vuelta.classList.remove("si"); }, 330);
    }, 340);
  }
  redondos[0].addEventListener("click", function () { volver(); });
  vuelta.querySelector("[data-sacudir]").addEventListener("click", sacudido);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !M.hayCapa() && !(document.activeElement && document.activeElement.isContentEditable)) volver(); });
  var ultimo = 0;
  window.addEventListener("devicemotion", function (e) {
    var a = e.acceleration || e.accelerationIncludingGravity; if (!a || abierto) return;
    var f = Math.abs(a.x || 0) + Math.abs(a.y || 0) + Math.abs(a.z || 0);
    if (f > 30 && Date.now() - ultimo > 1500) { ultimo = Date.now(); sacudido(); }
  });
});
</script>
</body>
</html>
