<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usuarios · mostrale el código (celular)</title>
<link rel="stylesheet" href="../../../_comun/comun.css">
<link rel="stylesheet" href="../../_extra/usuarios.css">
<script src="../../../_comun/iconos.js"></script>
<script src="../../_extra/iconos-extra.js"></script>
<link rel="stylesheet" href="../../_extra/interacciones.css">
<script src="../../../_comun/navegar.js" defer></script>
<style>
  body { width: 390px; }
  .arriba { display: flex; align-items: center; gap: 12px; padding: 4px 16px 0; }
  .cuerpo { flex: 1; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 12px; }
  .qrbox { background: #fff; border-radius: 24px; border: 1px solid var(--borde); box-shadow: var(--sombra-2); padding: 18px; display: grid; justify-items: center; gap: 10px; text-align: center; }
  .qrbox img { width: 212px; height: 212px; }
  .vence { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--texto-2); }
  .llega { background: #fff; border-radius: 24px; box-shadow: var(--sombra-3); border: 1.5px solid var(--logro); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .llega .quien { display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: center; }
  .grande-chips { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .gc { height: 72px; border-radius: 14px; border: 1px solid var(--borde-fuerte); background: #fff; display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 14px; font-weight: 700; color: var(--texto-2); }
  .gc.si { background: var(--pino); border-color: var(--pino); color: #fff; }
  .huella { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .pasos { display: flex; gap: 6px; justify-content: center; font-size: 14px; font-weight: 700; }
  .pasos span { white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px; border-radius: 99px; }
  .pasos .ok { background: var(--logro-suave); color: var(--logro-texto); }
  .pasos .ya { background: var(--pino); color: #fff; }
</style>
</head>
<body>
<div class="celu">
  <div class="barra-estado"><span>10:42</span><span class="se"><i class="i i-s" data-i="wifi"></i><svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#1A1D1B" opacity=".4"/><rect x="2" y="2" width="16" height="9" rx="2" fill="#1A1D1B"/></svg></span></div>
  <div class="arriba"><button class="btn btn-suave btn-icono"><i class="i" data-i="x"></i></button><div class="grow"><div class="t-seccion">Sumar a alguien</div></div><span class="pastilla contorno">o por correo</span></div>
  <div class="cuerpo">
    <div class="qrbox">
      <img src="../../_extra/qr.svg" alt="">
      <div class="t-renglon">Que lo escanee con su celular</div>
      <div class="vence"><i class="i i-s" data-i="clock"></i>Se renueva en 4:12 · sirve una vez</div>
    </div>

    <div class="pasos"><span class="ok"><i class="i i-s" data-i="check"></i>Escaneó</span><span class="ok"><i class="i i-s" data-i="check"></i>Entró</span><span class="ya">Elegí qué hace</span></div>
    <div class="llega">
      <div class="quien"><span class="av l t3" style="width:48px;height:48px">RG</span><div style="min-width:0"><div class="t-renglon">Ramiro Giménez</div><div class="t-detalle ellipsis">ramiro.gimenez.ferre@gmail.com</div></div></div>
      <div class="grande-chips">
        <div class="gc si"><i class="i" data-i="shopping-cart"></i>Vendedor</div>
        <div class="gc"><i class="i" data-i="package"></i>Recepción</div>
        <div class="gc"><i class="i" data-i="truck"></i>Comprador</div>
      </div>
      <div class="t-detalle" style="margin-top:-4px">También: <b style="color:var(--pino-texto)">Gerente</b> · <b style="color:var(--pino-texto)">Administrador</b></div>
      <button class="btn btn-accion grande" style="width:100%"><i class="i i-l" data-i="fingerprint"></i>Dejalo entrar con tu huella</button>
    </div>
    <div class="lineal" style="margin-top:auto;margin-bottom:28px;gap:8px"><button class="btn" style="flex:1"><i class="i" data-i="share-2"></i>Mandar enlace</button><button class="btn btn-fantasma" style="flex:1;color:var(--error-texto)">No es de acá</button></div>
  </div>
  <span class="home-ind"></span>
</div>
<script src="../../_extra/interacciones.js"></script>
<script>
/* Celu 3 · mostrale el código: el QR cuenta para atrás; al rato, alguien lo escanea y su tarjeta sube;
   se elige el rol con un botón grande y se lo deja entrar con la huella; «No es de acá» lo rechaza;
   «Mandar enlace» y «o por correo» son las otras formas; la × vuelve a la lista de usuarios. */
(function () {
  var $ = U.$, $$ = U.$$;
  var cuerpo = $('.cuerpo'), qrbox = $('.qrbox'), img = $('img', qrbox), pasos = $('.pasos'), reloj = $('.vence', qrbox), pie = $('.cuerpo > .lineal');
  var actual = U.NUEVOS[0], rol = 'vendedor', seg = 252, espera = null;
  img.style.transition = 'transform var(--t-nav) var(--curva), opacity var(--t-nav) var(--curva)';
  img.style.cursor = 'pointer';

  // El código se renueva solo.
  setInterval(function () {
    seg = seg > 0 ? seg - 1 : 299;
    reloj.lastChild.textContent = 'Se renueva en ' + Math.floor(seg / 60) + ':' + ('0' + seg % 60).slice(-2) + ' · sirve una vez';
  }, 1000);

  var GRANDES = [['vendedor', 'Vendedor'], ['recepcion', 'Recepción'], ['comprador', 'Comprador']];
  function llegaHTML(x) {
    return '<div class="llega"><div class="quien"><span class="av l ' + x.t + '" style="width:48px;height:48px">' + x.ini + '</span><div style="min-width:0"><div class="t-renglon">' + x.n + '</div><div class="t-detalle ellipsis">' + x.mail + '</div></div></div>' +
      '<div class="grande-chips">' + GRANDES.map(function (g) { return '<div class="gc' + (rol === g[0] ? ' si' : '') + '" data-rol="' + g[0] + '"><i class="i" data-i="' + U.ROLES[g[0]].i + '"></i>' + g[1] + '</div>'; }).join('') + '</div>' +
      '<div class="t-detalle" style="margin-top:-4px">También: <b style="color:var(--pino-texto)" data-rol="gerente">Gerente</b> · <b style="color:var(--pino-texto)" data-rol="admin">Administrador</b></div>' +
      '<button class="btn btn-accion grande" style="width:100%" data-huella><i class="i i-l" data-i="fingerprint"></i>Dejalo entrar con tu huella</button></div>';
  }
  function marcarRol(llega) {
    $$('[data-rol]', llega).forEach(function (e) {
      var si = e.getAttribute('data-rol') === rol;
      if (e.classList.contains('gc')) e.classList.toggle('si', si);
      else e.style.cssText = 'color:var(--pino-texto);cursor:pointer;' + (si ? 'background:var(--pino);color:#fff;border-radius:99px;padding:2px 8px' : '');
    });
  }
  function pasosHTML(n) {
    var t = ['Escaneó', 'Entró', 'Elegí qué hace'];
    return t.map(function (x, i) {
      return i < n ? '<span class="ok"><i class="i i-s" data-i="check"></i>' + x + '</span>' : i === n && n === 2 ? '<span class="ya">' + x + '</span>' : '<span style="background:var(--hundido);color:var(--texto-2)">' + x + '</span>';
    }).join('');
  }
  function ponerPasos(n) { pasos.innerHTML = pasosHTML(n); U.iconos(pasos); }

  // La tarjeta que ya está dibujada se conecta sin redibujarla.
  var llega = $('.llega');
  $$('.gc', llega).forEach(function (g, i) { g.setAttribute('data-rol', GRANDES[i][0]); });
  $$('.llega > .t-detalle b').forEach(function (b, i) { b.setAttribute('data-rol', i ? 'admin' : 'gerente'); b.style.cursor = 'pointer'; });
  $('.llega .btn-accion').setAttribute('data-huella', '');

  cuerpo.addEventListener('click', function (e) {
    var r = e.target.closest('.llega [data-rol]');
    if (r) { rol = r.getAttribute('data-rol'); marcarRol(llega); U.vibrar(10); return; }
    if (e.target.closest('[data-huella]')) return huella();
    if (e.target === img && !llega) return escanea();
  });

  // Alguien escanea: el QR se achica y se aclara, la tarjeta sube y los pasos se marcan.
  function escanea() {
    clearTimeout(espera);
    var usados = U.PERSONAS.map(function (p) { return p.mail; });
    actual = U.NUEVOS.filter(function (n) { return usados.indexOf(n.mail) < 0; })[0];
    if (!actual) return;
    rol = 'vendedor';
    img.style.transform = 'scale(.9)'; img.style.opacity = '.35';
    ponerPasos(1);
    setTimeout(function () { ponerPasos(2); }, U.quieto ? 0 : 400);
    pasos.insertAdjacentHTML('afterend', llegaHTML(actual));
    llega = $('.llega'); U.iconos(llega); marcarRol(llega);
    U.animar(llega, 'u-sube', 500); U.vibrar(10);
  }
  function esperar() {
    llega = null;
    img.style.transform = ''; img.style.opacity = '';
    ponerPasos(0);
    espera = setTimeout(escanea, 3500);
  }

  // La huella: el sensor late, la tilde se dibuja y la persona queda en la lista.
  function huella() {
    var x = actual, r = rol;
    var c = U.capa({ tipo: 'dialogo', html: '<div style="display:grid;justify-items:center;gap:12px;padding:8px 0;text-align:center" data-sensor>' +
      '<span class="foto-icono u-latido" style="width:88px;height:88px;border-radius:99px;background:var(--accion-suave);color:var(--accion)"><i class="i" data-i="fingerprint" style="width:48px;height:48px"></i></span>' +
      '<div class="t-seccion">Apoyá el dedo</div><div class="t-detalle">Para dejar entrar a ' + x.n + ' como ' + U.ROLES[r].n + '.</div><button class="btn btn-fantasma" data-cerrar>Cancelar</button></div>' });
    var listo = setTimeout(function () {
      if (c.cerrada) return;
      var s = $('[data-sensor]', c.el);
      s.innerHTML = '<span style="width:88px;height:88px;border-radius:99px;background:var(--logro-suave);display:grid;place-items:center"><svg class="u-tilde" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--logro)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>' +
        '<div class="t-seccion">' + U.primerNombre(x) + ' ya puede entrar</div><div class="t-detalle">Como ' + U.ROLES[r].n + '. En su celular, la app se abre sola.</div>';
      U.vibrar([10, 40, 10]);
      U.agregarPersona(x, [r]).nuevo = false;
      ponerPasos(3);
      setTimeout(function () {
        c.cerrar();
        U.sacar(llega, esperar);
        U.tostada(x.n + ' quedó en la lista como ' + U.ROLES[r].n + '.');
      }, U.quieto ? 400 : 1300);
    }, U.quieto ? 300 : 1100);
    c.el.addEventListener('click', function (e) { if (e.target.closest('[data-cerrar]')) clearTimeout(listo); });
  }

  // Abajo: Mandar enlace y No es de acá.
  var bMandar = $$('.btn', pie)[0], bNo = $$('.btn', pie)[1];
  bNo.addEventListener('click', function () {
    if (!llega) return U.tostada('Todavía no escaneó nadie.', { icono: 'info' });
    var x = actual;
    U.sacar(llega, esperar);
    U.tostada(U.primerNombre(x) + ' no va a poder entrar.', { icono: 'circle-x' });
  });
  bMandar.addEventListener('click', function () {
    var c = U.capa({ tipo: 'hoja', html: '<div class="u-cab"><div class="t-seccion">Mandar el enlace</div><button class="btn btn-suave btn-icono chico" data-cerrar aria-label="Cerrar"><i class="i i-s" data-i="x"></i></button></div>' +
      '<div class="t-detalle">Para quien no está al lado: entra con su Google desde el enlace. Sirve una vez y vence en 24 h.</div>' +
      [['message-circle', 'WhatsApp'], ['mail', 'Correo'], ['copy', 'Copiar el enlace']].map(function (o) { return '<div class="renglon" data-op="' + o[1] + '" style="grid-template-columns:44px 1fr auto;padding:10px 12px;margin:0;cursor:pointer"><span class="foto-icono" style="width:44px;height:44px"><i class="i" data-i="' + o[0] + '"></i></span><div class="titulo">' + o[1] + '</div><i class="i" data-i="chevron-right" style="color:var(--texto-3)"></i></div>'; }).join('') });
    c.el.addEventListener('click', function (e) {
      var o = e.target.closest('[data-op]'); if (!o) return;
      o = o.getAttribute('data-op'); c.cerrar();
      U.tostada(o === 'Copiar el enlace' ? 'Enlace copiado. Pegalo donde quieras.' : 'Listo para mandar por ' + o + '.', { icono: 'link' });
    });
  });
  // o por correo: el alta de siempre, en una hoja.
  var porCorreo = $('.arriba .pastilla'); porCorreo.style.cursor = 'pointer';
  porCorreo.addEventListener('click', function () {
    U.dialogoAutorizar(function (p) { U.tostada(U.primerNombre(p) + ' ya puede entrar con su Google.'); });
  });

  // La ×: sale del modo y muestra la lista de usuarios, con «Sumar a alguien» para volver.
  var lista = null;
  $('.arriba .btn').addEventListener('click', function () {
    lista = document.createElement('div');
    lista.style.cssText = 'position:absolute;inset:0;z-index:40;background:var(--fondo);display:flex;flex-direction:column;padding-top:44px';
    U.raiz.appendChild(lista);
    pintarLista(); U.animar(lista, 'u-funde', 300);
  });
  function pintarLista() {
    lista.innerHTML = '<div class="celu-cabecera" style="padding-bottom:4px"><span class="t-titulo">Usuarios</span><span class="pastilla contorno">' + U.PERSONAS.length + '</span></div>' +
      '<div style="flex:1;overflow-y:auto;scrollbar-width:none;padding:12px 16px;display:flex;flex-direction:column;gap:8px">' + U.PERSONAS.map(function (p) {
        var est = p.inactivo ? '<span class="pastilla contorno">Inactivo</span>' : (p.nuevo && !p.sesiones.length) ? '<span class="pastilla urgente">No entró aún</span>' : '<i class="i" data-i="chevron-right" style="color:var(--texto-3)"></i>';
        return '<div class="renglon" data-id="' + p.id + '" style="grid-template-columns:40px 1fr auto;padding:10px 12px;margin:0;cursor:pointer">' + U.avHTML(p) + '<div style="min-width:0"><div class="titulo">' + U.esc(p.n) + (p.yo ? ' <span class="yo">Vos</span>' : '') + '</div><div class="detalle ellipsis">' + (U.rolesOrdenados(p).map(function (r) { return U.ROLES[r].n; }).join(' · ') || 'Sin roles') + '</div></div>' + est + '</div>';
      }).join('') + '</div>' +
      '<div class="barra-accion" style="padding-bottom:28px"><button class="btn btn-accion grande" style="width:100%" data-volver><i class="i i-l" data-i="qr-code"></i>Sumar a alguien</button></div>';
    U.iconos(lista);
  }
  document.addEventListener('click', function (e) {
    if (!lista || !lista.contains(e.target)) return;
    if (e.target.closest('[data-volver]')) { var l = lista; lista = null; l.style.transition = 'opacity var(--t) var(--curva)'; l.style.opacity = '0'; setTimeout(function () { l.remove(); }, U.quieto ? 0 : 220); return; }
    var r = e.target.closest('[data-id]');
    if (r) {
      var p = U.persona(r.getAttribute('data-id'));
      if (p.inactivo) return U.tostada(U.primerNombre(p) + ' está inactivo.', { icono: 'info' });
      U.dialogoRoles(p, function (sel) { p.roles = sel; delete p.puedeFijo; pintarLista(); U.tostada(U.primerNombre(p) + ' ahora es ' + (sel.map(function (x) { return U.ROLES[x].n; }).join(' y ') || 'sin roles') + '.'); });
    }
  });
})();
</script>
</body>
</html>
