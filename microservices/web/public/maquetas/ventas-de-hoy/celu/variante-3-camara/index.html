<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ventas de hoy · El cambio se escanea (celular)</title>
<link rel="stylesheet" href="../../../_comun/comun.css">
<link rel="stylesheet" href="../../ventas.css">
<link rel="stylesheet" href="../../interacciones.css">
<script src="../../../_comun/iconos.js"></script>
<script src="../../iconos-extra.js"></script>
<script src="../../../_comun/navegar.js" defer></script>
<style>
  body { width: 390px; }
  .celu { background: #161917; }
  .camara { position: absolute; inset: 0 0 auto 0; height: 500px; overflow: hidden;
    background: radial-gradient(120% 80% at 50% 45%, #4a4f49 0%, #2a2e2a 45%, #121412 100%); }
  .camara::before { content: ""; position: absolute; left: -10%; right: -10%; top: 300px; height: 260px; background: linear-gradient(180deg, #5b4a38, #3a2f24); transform: perspective(400px) rotateX(55deg); opacity: .55; filter: blur(1px); }
  .camara img { position: absolute; width: 300px; left: 50%; top: 120px; transform: translateX(-50%) rotate(-18deg); filter: drop-shadow(0 18px 18px rgba(0,0,0,.55)); }
  .retic { position: absolute; left: 70px; right: 70px; top: 140px; height: 220px; }
  .retic b { position: absolute; width: 44px; height: 44px; border: 4px solid #fff; }
  .retic b:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-radius: 14px 0 0 0; }
  .retic b:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-radius: 0 14px 0 0; }
  .retic b:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 14px; }
  .retic b:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-radius: 0 0 14px 0; }
  .laser { position: absolute; left: 20px; right: 20px; top: 50%; height: 3px; border-radius: 3px; background: var(--accion); box-shadow: 0 0 14px 2px rgba(232,84,28,.7); }
  .barra-estado { position: relative; z-index: 3; color: #fff; }
  .arriba { position: relative; z-index: 3; display: flex; align-items: center; gap: 10px; padding: 4px 16px; }
  .vidrio { background: rgba(255,255,255,.14); backdrop-filter: blur(14px); color: #fff; border: 1px solid rgba(255,255,255,.18); }
  .x { width: 44px; height: 44px; border-radius: 99px; display: grid; place-items: center; }
  .pasos { display: flex; gap: 4px; padding: 4px; border-radius: 99px; margin-left: auto; }
  .pasos span { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 99px; font-weight: 700; font-size: 14px; color: rgba(255,255,255,.8); }
  .pasos span.hecho { color: #fff; }
  .pasos span.ahora { background: #fff; color: var(--tinta); }
  .leyo { position: absolute; z-index: 3; left: 16px; right: 16px; top: 384px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 16px; background: #fff; box-shadow: var(--sombra-3); }
  .leyo .ok { width: 36px; height: 36px; border-radius: 99px; background: var(--logro); color: #fff; display: grid; place-items: center; flex: none; }
  .leyo .q { font-weight: 750; font-size: 15px; line-height: 20px; }
  .leyo .d { font-size: 14px; color: var(--texto-2); line-height: 18px; }
  .leyo .v { margin-left: auto; font-weight: 800; font-size: 16px; white-space: nowrap; }

  .hoja { position: absolute; z-index: 4; left: 0; right: 0; bottom: 0; top: 456px; background: var(--fondo); border-radius: var(--r-hoja) var(--r-hoja) 0 0; padding: 8px 16px 0; display: flex; flex-direction: column; gap: 8px; }
  .agarre { width: 40px; height: 5px; border-radius: 99px; background: var(--borde-fuerte); margin: 0 auto 2px; }
  .cr { display: grid; grid-template-columns: 48px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 8px 12px; }
  .cr .foto { width: 48px; height: 48px; }
  .cr .q { font-weight: 700; font-size: 15px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cr .d { font-size: 14px; color: var(--texto-2); line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cr .v { font-weight: 800; font-size: 16px; text-align: right; }
  .cr .v small { display: block; font-size: 14px; font-weight: 650; }
  .et-linea { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--texto-2); margin: 2px 4px -2px; }
  .difer { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; }
  .difer .t-numero { font-size: 32px; }
  .medios { display: flex; gap: 6px; }
  .medios .m { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px 0 6px; border-radius: 99px; border: 1px solid var(--borde-fuerte); background: #fff; font-weight: 700; font-size: 14px; }
  .medios .m .mico { width: 28px; height: 28px; }
  .medios .m.elegido { border: 2px solid var(--c); background: var(--cs); }
  .medios .m.elegido .mico { background: var(--c); color: #fff; }
  .deslizar { position: relative; height: 60px; border-radius: 99px; background: var(--accion); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; box-shadow: var(--sombra-accion); margin-top: 2px; }
  .deslizar .pulgar { position: absolute; left: 6px; top: 6px; width: 48px; height: 48px; border-radius: 99px; background: #fff; color: var(--accion); display: grid; place-items: center; }
  .home-ind { z-index: 6; }
</style>
</head>
<body>
<div class="celu">
  <div class="camara">
    <img src="../../../_comun/fotos/pinza.webp" alt="">
    <div class="retic"><b></b><b></b><b></b><b></b><span class="laser"></span></div>
  </div>
  <div class="barra-estado"><span>17:05</span><span class="se"><i class="i i-s" data-i="wifi"></i><svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#fff" opacity=".5"/><rect x="2" y="2" width="13" height="9" rx="2" fill="#fff"/></svg></span></div>
  <div class="arriba">
    <span class="x vidrio"><i class="i i-l" data-i="x"></i></span>
    <div class="pasos vidrio"><span class="hecho"><i class="i i-s" data-i="check"></i>Vuelve</span><span class="ahora"><i class="i i-s" data-i="scan-barcode"></i>Se lleva</span></div>
  </div>
  <div class="leyo"><span class="ok"><i class="i" data-i="check"></i></span><div style="min-width:0"><div class="q">Pinza de punta larga 8"</div><div class="d">Bremen · 6 un. en stock</div></div><span class="v num">$18.000</span></div>

  <div class="hoja">
    <div class="agarre"></div>
    <div class="et-linea"><i class="i i-s" data-i="rotate-ccw"></i>Vuelve al stock</div>
    <div class="tarjeta cr">
      <span class="foto"><img src="../../../_comun/fotos/pinza.webp" alt=""></span>
      <div style="min-width:0"><div class="q">Pinza universal 8" aislada</div><div class="d">Vendida hoy 10:25 · Tarjeta</div></div>
      <span class="v num" style="color:var(--logro-texto)">−$14.000</span>
    </div>
    <div class="et-linea"><i class="i i-s" data-i="shopping-bag"></i>Se lleva</div>
    <div class="tarjeta cr" style="border-color:var(--logro);box-shadow:0 0 0 3px var(--logro-suave)">
      <span class="foto"><img src="../../../_comun/fotos/pinza.webp" alt="" style="transform:scaleX(-1)"></span>
      <div style="min-width:0"><div class="q">Pinza de punta larga 8"</div><div class="d">Bremen · margen 100 %</div></div>
      <span class="v num">+$18.000</span>
    </div>
    <div class="difer"><div><div class="t-etiqueta">Diferencia a cobrar</div><div class="t-numero num"><span class="peso">$</span>4.000</div></div>
      <div class="medios">
        <span class="m medio efectivo elegido"><span class="mico"><i class="i i-s" data-i="banknote"></i></span>Efectivo</span>
        <span class="m medio mp" style="padding:0 6px"><span class="mico"><i class="i i-s" data-i="qr-code"></i></span></span>
        <span class="m medio tarjeta" style="padding:0 6px"><span class="mico"><i class="i i-s" data-i="credit-card"></i></span></span>
      </div>
    </div>
    <div class="deslizar"><span class="pulgar"><i class="i i-l" data-i="arrow-right"></i></span>Deslizá para cobrar $4.000</div>
  </div>
  <span class="home-ind"></span>
</div>
<script src="../../interacciones.js"></script>
<script>
/* Celular 3 · El cambio se escanea: tocar la cámara simula leer un código (el marco se cierra,
   vibra y el producto entra en la hoja); «Vuelve» y «Se lleva» cambian de paso; los medios se
   eligen; el botón naranja se desliza hasta el final para cobrar. La × pregunta antes de salir. */
(function () {
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var plata = VH.plata, it = VH.it;
  var celu = $('.celu'), camara = $('.camara'), retic = $('.retic'), leyo = $('.leyo'), hoja = $('.hoja');
  var pasos = $$('.pasos span'), dif = $('.difer .t-numero'), desl = $('.deslizar'), pulgar = $('.pulgar');
  var st = {
    paso: 'lleva', medio: 'efectivo',
    vuelve: [it('Pinza universal 8" aislada', 'Vendida hoy 10:25 · Tarjeta', 'pinza', 1, 14000)],
    lleva: [it('Pinza de punta larga 8"', 'Bremen · margen 100 %', 'pinza', 1, 18000)],
  };
  var COLA = {
    lleva: [it('Cinta métrica 5 m', 'Stanley · 4 un. en stock', 'cinta-metrica', 1, 12000), it('Puntas Phillips PH2 × 10', 'Bremen · 9 un. en stock', 'puntas', 1, 9000), it('Mecha acero rápido HSS 6 mm', 'Ezeta · 12 un. en stock', 'mecha', 1, 6000)],
    vuelve: [it('Mecha acero rápido HSS 8 mm', 'Vendida hoy 12:30 · Mercado Pago', 'mecha', 1, 7000), it('Tarugos nylon S8 con tope × 100', 'Vendida hoy 16:48 · Cta. cte.', 'tarugos', 1, 8000)],
  };
  var etVuelve = $$('.et-linea', hoja)[0], etLleva = $$('.et-linea', hoja)[1];
  var cards = $$('.cr', hoja);
  cards[0].dataset.lista = 'vuelve'; cards[1].dataset.lista = 'lleva';
  function diferencia() { return st.lleva.reduce(function (a, x) { return a + x.precio; }, 0) - st.vuelve.reduce(function (a, x) { return a + x.precio; }, 0); }
  function crHTML(x, lista) {
    return '<div class="tarjeta cr" data-lista="' + lista + '">' + VH.foto(x.foto) + '<div style="min-width:0"><div class="q">' + x.nom + '</div><div class="d">' + x.det + '</div></div><span class="v num"' +
      (lista === 'vuelve' ? ' style="color:var(--logro-texto)">−' : '>+') + plata(x.precio) + '</span></div>';
  }
  function textoBoton() {
    var d = diferencia();
    return d > 0 ? 'Deslizá para cobrar ' + plata(d) : d < 0 ? 'Deslizá para devolver ' + plata(-d) : 'Deslizá para registrar';
  }
  function pintarDif(dir) {
    var d = diferencia();
    $('.difer .t-etiqueta').textContent = d >= 0 ? 'Diferencia a cobrar' : 'Diferencia a devolver';
    VH.rodar(dif, plata(Math.abs(d)), dir, 20);
    var n = Array.prototype.filter.call(desl.childNodes, function (x) { return x.nodeType === 3 && x.textContent.trim(); })[0];
    if (n) n.textContent = textoBoton();
  }
  /* La hoja crece con lo que se escanea; lo leído queda justo arriba de la hoja. */
  function acomodar() {
    hoja.style.top = 'auto';
    var alto = hoja.offsetHeight + 28;
    hoja.style.paddingBottom = '28px';
    var top = Math.max(250, 844 - alto);
    hoja.style.top = top + 'px'; hoja.style.paddingBottom = '';
    leyo.style.top = (top - 72) + 'px';
    if (hoja.scrollHeight > hoja.clientHeight) hoja.style.overflowY = 'auto';
  }
  function pintarPasos() {
    pasos[0].className = st.paso === 'vuelve' ? 'ahora' : 'hecho';
    pasos[1].className = st.paso === 'lleva' ? 'ahora' : (st.lleva.length ? 'hecho' : '');
    pasos[0].innerHTML = '<i class="i i-s" data-i="' + (st.paso === 'vuelve' ? 'scan-barcode' : 'check') + '"></i>Vuelve';
    pasos[1].innerHTML = '<i class="i i-s" data-i="' + (st.paso === 'lleva' ? 'scan-barcode' : 'check') + '"></i>Se lleva';
    VH.iconos($('.pasos'));
  }
  function mostrarLeido(x) {
    var esV = st.paso === 'vuelve';
    leyo.innerHTML = '<span class="ok"><i class="i" data-i="check"></i></span><div style="min-width:0"><div class="q" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + x.nom + '</div><div class="d" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + x.det + '</div></div><span class="v num">' + (esV ? '−' : '') + plata(x.precio) + '</span>';
    VH.iconos(leyo);
    leyo.classList.remove('vh-entra'); void leyo.offsetWidth; leyo.classList.add('vh-entra');
    $('img', camara).src = '../../../_comun/fotos/' + (x.foto || 'tornillos') + '.webp';
  }
  function escanear() {
    var cola = COLA[st.paso];
    if (!cola.length) { VH.avisar('Ya no hay más para leer en la maqueta', 'scan-barcode'); return; }
    var x = cola.shift(), lista = st.paso;
    if (!VH.reducido()) { retic.style.animation = 'none'; void retic.offsetWidth; retic.style.animation = 'vh-cierra 260ms var(--curva)'; }
    VH.vibrar(10);
    st[lista].push(x);
    mostrarLeido(x);
    var ultima = $$('.cr[data-lista="' + lista + '"]', hoja).pop();
    ultima.insertAdjacentHTML('afterend', crHTML(x, lista));
    var nueva = ultima.nextElementSibling;
    nueva.style.borderColor = 'var(--logro)'; nueva.style.boxShadow = '0 0 0 3px var(--logro-suave)'; nueva.classList.add('vh-entra');
    $$('.cr', hoja).forEach(function (c) { if (c !== nueva) { c.style.borderColor = ''; c.style.boxShadow = ''; } });
    setTimeout(function () { nueva.style.borderColor = ''; nueva.style.boxShadow = ''; }, 1000);
    VH.iconos(nueva);
    pintarDif(lista === 'lleva' ? 1 : -1);
    acomodar();
  }
  camara.addEventListener('click', escanear);
  camara.style.cursor = 'pointer';
  retic.style.transformOrigin = 'center';

  // Pasos
  pasos.forEach(function (p, i) {
    p.style.cursor = 'pointer';
    p.addEventListener('click', function () {
      st.paso = i ? 'lleva' : 'vuelve';
      pintarPasos();
      var ult = st[st.paso][st[st.paso].length - 1];
      if (ult) mostrarLeido(ult);
      VH.avisar(i ? 'Escaneá lo que se lleva' : 'Escaneá lo que vuelve', 'scan-barcode');
    });
  });

  // Medios
  var medios = $('.medios');
  medios.addEventListener('click', function (e) {
    var b = e.target.closest('.m'); if (!b) return;
    var m = ['efectivo', 'mp', 'tarjeta'].filter(function (k) { return b.classList.contains(k); })[0];
    st.medio = m;
    medios.innerHTML = ['efectivo', 'mp', 'tarjeta'].map(function (k) {
      return '<span class="m medio ' + k + (k === m ? ' elegido' : '') + '"' + (k === m ? '' : ' style="padding:0 6px"') + '><span class="mico"><i class="i i-s" data-i="' + VH.MEDIOS[k].ico + '"></i></span>' + (k === m ? VH.MEDIOS[k].corto : '') + '</span>';
    }).join('');
    VH.iconos(medios); VH.vibrar(10);
  });
  $$('.medios .m').forEach(function (m) { m.style.cursor = 'pointer'; });

  // Deslizá para cobrar
  var arr = null;
  pulgar.style.touchAction = 'none'; desl.style.touchAction = 'none';
  desl.addEventListener('pointerdown', function (e) {
    arr = { x: e.clientX, max: desl.offsetWidth - pulgar.offsetWidth - 12, dx: 0, enPulgar: !!e.target.closest('.pulgar') };
    try { desl.setPointerCapture(e.pointerId); } catch (x) { /* nada */ }
    pulgar.style.transition = 'none';
  });
  desl.addEventListener('pointermove', function (e) {
    if (!arr) return;
    arr.dx = Math.max(0, Math.min(arr.max, e.clientX - arr.x));
    pulgar.style.transform = 'translateX(' + arr.dx + 'px)';
  });
  function soltar() {
    if (!arr) return;
    var a = arr; arr = null;
    pulgar.style.transition = 'transform var(--t) var(--curva)';
    if (a.dx >= a.max * 0.85) { pulgar.style.transform = 'translateX(' + a.max + 'px)'; cobrar(); return; }
    pulgar.style.transform = '';
    if (a.dx < 4 && !VH.reducido()) { // un toque: el pulgar empuja para mostrar el gesto
      pulgar.style.animation = 'none'; void pulgar.offsetWidth; pulgar.style.animation = 'vh-empuja 500ms var(--curva)';
      VH.avisar('Deslizá el círculo hasta el final', 'arrow-right');
    }
  }
  desl.addEventListener('pointerup', soltar);
  desl.addEventListener('pointercancel', soltar);
  function cobrar() {
    VH.vibrar([10, 40, 10]);
    var d = diferencia();
    pulgar.innerHTML = '<i class="i i-l vh-rebota" data-i="check"></i>'; VH.iconos(pulgar);
    setTimeout(function () {
      var l = document.createElement('div'); l.className = 'vh-listo';
      l.innerHTML = '<span class="ok"><i class="i" data-i="check"></i></span><div class="t-titulo">Cambio registrado</div>' +
        '<div class="t-cuerpo" style="color:var(--texto-2)">Volvió ' + st.vuelve.map(function (x) { return x.nom; }).join(', ') + '.<br>Se llevó ' + st.lleva.map(function (x) { return x.nom; }).join(', ') + '.</div>' +
        '<div class="pastilla medio ' + st.medio + '" style="margin-top:8px;background:var(--cs);color:var(--c)">' + (d >= 0 ? 'Cobrado ' : 'Devuelto ') + plata(Math.abs(d)) + ' · ' + VH.MEDIOS[st.medio].nom + '</div>' +
        '<div class="t-detalle" style="margin-top:4px">El stock ya se movió · queda en Quién hizo qué</div>' +
        '<button class="btn btn-accion grande" data-otro>Registrar otro cambio</button><button class="btn btn-fantasma" data-volver style="margin-top:4px">Volver a Ventas de hoy</button>';
      celu.appendChild(l); VH.iconos(l);
      l.addEventListener('click', function (e) { if (e.target.closest('[data-otro], [data-volver]')) location.reload(); });
    }, 350);
  }

  // La × pregunta antes de salir
  var x = $('.arriba .x'); x.style.cursor = 'pointer';
  x.addEventListener('click', function () {
    var capa = VH.abrir({ tipo: 'hoja', html: VH.cab('¿Dejar el cambio?', 'Lo escaneado no se guarda') +
      '<div class="aviso urgente"><i class="i i-s" data-i="triangle-alert" style="margin-top:2px"></i><span>Volvió una pinza y se lleva otra: si salís, el stock no se mueve y no se cobra la diferencia.</span></div>' +
      '<div class="vh-pie"><button class="btn" data-cerrar>Seguir escaneando</button><button class="btn btn-peligro" data-salir>Dejar</button></div>' });
    capa.el.addEventListener('click', function (e) { if (e.target.closest('[data-salir]')) { capa.cerrar(); VH.avisar('Cambio descartado', 'x'); setTimeout(function () { location.reload(); }, 900); } });
  });

  // El láser late mientras la cámara mira
  $('.laser').style.animation = 'vh-pulso 1.2s ease-in-out infinite';
})();
</script>
</body>
</html>
