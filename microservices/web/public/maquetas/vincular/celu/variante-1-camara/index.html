<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vincular con la computadora · celular · 1 Evolución: la cámara adentro</title>
<link rel="stylesheet" href="../../../_comun/comun.css">
<link rel="stylesheet" href="../../_recursos/vincular.css">
<script src="../../../_comun/iconos.js"></script>
<script src="../../_recursos/iconos-extra.js"></script>
<script src="../../../_comun/navegar.js" defer></script>
<style>
  body { width: 390px; }
  .celu.camara { background: #0d1210; }
  .barra-estado { color: #fff; position: relative; z-index: 2; }
  .barra-estado svg rect { stroke: #fff; } .barra-estado svg rect + rect { fill: #fff; }
  .arriba { position: relative; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 4px 16px 0; }
  .arriba .tit { flex: 1; text-align: center; font-weight: 750; font-size: 17px; }
  .monitor { left: 70px; top: 200px; }
  .esquinas.leido { left: 132px; top: 192px; width: 150px; height: 150px; color: var(--logro); animation: cerrar var(--t) var(--rebote) both; }
  @keyframes cerrar { from { transform: scale(1.25); opacity: .4; } }
  .encontrado { position: absolute; top: 140px; left: 50%; transform: translateX(-50%); z-index: 2; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 99px; background: var(--logro); color: #fff; font-weight: 750; font-size: 14px; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .hoja-abajo { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; background: var(--superficie); color: var(--tinta); border-radius: 24px 24px 0 0; padding: 12px 16px 34px; box-shadow: var(--sombra-3); display: grid; gap: 16px; animation: subir var(--t-nav) var(--curva) both; }
  .agarre { width: 40px; height: 5px; border-radius: 99px; background: var(--hundido-2); justify-self: center; }
  .equipo { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; }
  .equipo .ico { width: 56px; height: 56px; border-radius: 16px; background: var(--pino-suave); color: var(--pino-texto); display: grid; place-items: center; }
  .pasos-celu { display: grid; gap: 10px; }
  .pasos-celu div { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 15px; }
  .pasos-celu .ok { width: 24px; height: 24px; border-radius: 99px; background: var(--logro); color: #fff; display: grid; place-items: center; }
  .pasos-celu .giro { width: 24px; height: 24px; border-radius: 99px; border: 3px solid var(--hundido-2); border-top-color: var(--pino); animation: girar .8s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .home-ind { background: var(--tinta); z-index: 4; }
</style>
</head>
<body>
<div class="celu camara">
  <div class="fondo"></div>
  <div class="barra-estado"><span>10:42</span><span class="se"><i class="i i-s" data-i="wifi"></i><svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" opacity=".6"/><rect x="2" y="2" width="16" height="9" rx="2"/></svg></span></div>
  <div class="arriba">
    <button class="btn-cristal" aria-label="Volver" data-ir="vender"><i class="i i-l" data-i="x"></i></button>
    <span class="tit">Vincular con la compu</span>
    <button class="btn-cristal" aria-label="Linterna"><i class="i i-l" data-i="flashlight"></i></button>
  </div>

  <div class="monitor"><span class="lat"></span><span class="cuerpo"><span class="mini-qr"><img src="../../_recursos/qr.svg" alt=""></span></span></div>
  <div class="esquinas leido"></div>
  <span class="encontrado"><i class="i i-s" data-i="check"></i>Código de la compu leído</span>

  <div class="hoja-abajo">
    <span class="agarre"></span>
    <div class="equipo">
      <span class="ico"><i class="i i-xl" data-i="monitor"></i></span>
      <div><div class="t-seccion">Compu del mostrador</div><div class="t-detalle">Con tu usuario, Carlos Illobre</div></div>
    </div>
    <div class="pasos-celu">
      <div><span class="ok"><i class="i i-s" data-i="check"></i></span>Código leído</div>
      <div><span class="giro"></span>Uniendo los dos…</div>
    </div>
    <div class="aviso pino"><i class="i" data-i="shopping-cart"></i><span>La compu está en Vender con 5 productos: vas a ver esa misma venta.</span></div>
    <div class="t-detalle" style="text-align:center">¿No ves el código? En la compu: «Vincular el celular», abajo a la izquierda.</div>
  </div>
  <span class="home-ind"></span>
</div>
</body>
</html>
