# Un solo workspace para el front y el servidor; no hay librerías compartidas entre servicios (ADR-018).
# Procesos es un módulo aparte que se lleva a otros proyectos: la web importa sus pantallas (ADR-019).
# Cada servicio se empaqueta solo con lo suyo (pnpm deploy), ver ADR-010.
packages:
  - microservices/api
  - microservices/web
  - microservices/procesos/servidor
  - microservices/procesos/web
  - tests/e2e
